<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tracker GPS – Aplicador</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>
  <script src="auth.js"></script>
  <script src="alerts-core.js"></script>
  <script src="route-progress.js"></script>
  <script src="zone-geo.js"></script>
  <script src="route-layers.js"></script>
  <script src="clima-core.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: linear-gradient(90deg, var(--bg), var(--bg));
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 { font-size: 1.05rem; color: var(--accent-text); font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .role-badge {
      background: var(--success); color: var(--on-solid);
      font-size: 0.65rem; font-weight: 700;
      padding: 2px 8px; border-radius: 999px;
    }
    .btn-logout {
      background: transparent; border: 1px solid var(--border-strong); color: var(--text-muted);
      padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger-text); }
    #map { flex: 1; min-height: 0; width: 100%; }
    .bottom-panel {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 16px 16px; flex-shrink: 0;
      max-height: 55vh; max-height: 55dvh; overflow-y: auto;
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
    #map { min-height: 160px; }
    @media (max-width: 800px), (pointer: coarse) {
      .net .sync { min-height: 44px; padding: 0 12px; font-size: 0.8rem; }
      .route-next { min-height: 44px; display: flex; align-items: center; }
      .link-btn { margin-top: 8px; }
    }
    /* Celular horizontal: mapa a la izquierda, panel a la derecha */
    @media (orientation: landscape) and (max-height: 520px) {
      body.tracker-page {
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 44%);
        grid-template-rows: auto minmax(0, 1fr);
      }
      body.tracker-page header { grid-column: 1 / -1; padding-top: 4px; padding-bottom: 4px; }
      body.tracker-page #map { min-height: 0; height: 100%; }
      .bottom-panel { max-height: none; border-top: none; border-left: 1px solid var(--border); }
    }
    .view { display: none; }
    .view.show { display: block; }
    .panel-title {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); margin-bottom: 10px;
    }
    .job-list { display: flex; flex-direction: column; gap: 8px; }
    .job-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; cursor: pointer;
    }
    .job-card:active, .job-card:hover { border-color: var(--success); }
    .job-card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .job-card .lot { font-weight: 600; }
    .job-card .meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
    .pill { font-size: 0.66rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .st-pendiente { background: var(--warning-bg); color: var(--warning-text); }
    .st-en_curso { background: var(--success-bg); color: var(--success-text); }
    .st-finalizado { background: var(--info-bg); color: var(--info-text); }
    .st-cancelado { background: #27272a; color: #a1a1aa; }
    .empty {
      background: var(--warning-bg); color: var(--warning-text); font-size: 0.85rem;
      padding: 10px 12px; border-radius: 8px;
    }
    .job-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
    .job-head h2 { font-size: 1rem; }
    .formula { font-size: 0.8rem; color: var(--text-2); margin-bottom: 4px; }
    .notes { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .status-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.9rem; margin: 8px 0 10px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-subtle); flex-shrink: 0; }
    .dot.active {
      background: var(--success); box-shadow: 0 0 10px var(--success);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 10px;
    }
    .stat {
      background: var(--bg); border-radius: 8px; padding: 8px; text-align: center;
    }
    .stat .val { font-size: 1.1rem; font-weight: 700; color: var(--accent-text); }
    .stat .lbl { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }
    .coverage-bar {
      height: 8px; background: var(--border); border-radius: 999px;
      overflow: hidden; margin-bottom: 12px;
    }
    .coverage-bar .fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--danger), var(--warning), var(--success));
      border-radius: 999px; transition: width 0.3s;
    }
    .route-box { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; border: 1px solid var(--border); }
    .route-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.85rem; color: var(--text-2); }
    .route-head strong { color: var(--success-text); font-size: 1.8rem; font-weight: 800; line-height: 1; }
    .route-box .coverage-bar { margin: 8px 0 6px; height: 12px; }
    .pos-dot { width: 18px; height: 18px; background: var(--success); border: 3px solid white; border-radius: 50%; box-shadow: 0 0 12px var(--success); position: relative; }
    .pos-dot::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--success); animation: ring 1.8s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
    .deleted-box { background: var(--danger-bg); color: var(--danger-text); border-radius: 10px; padding: 12px; font-size: 0.9rem; line-height: 1.45; margin-bottom: 10px; }
    .route-box .fill { background: linear-gradient(90deg, var(--text-subtle), var(--success)); }
    .route-next { font-size: 0.75rem; color: var(--text-muted); cursor: pointer; }
    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1; padding: 14px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .btn-start { background: var(--success); color: var(--on-solid); }
    .btn-pause { background: var(--warning); color: var(--on-solid); }
    .btn-stop { background: var(--danger); color: white; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .link-btn { background: none; border: none; color: var(--accent-text); cursor: pointer; font-size: 0.85rem; margin-top: 12px; }
    .msg { font-size: 0.82rem; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; display: none; }
    .msg.error { display: block; background: var(--danger-bg); color: var(--danger-text); }
    .msg.ok { display: block; background: var(--success-bg); color: var(--success-text); }
    .net {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 0.78rem; color: var(--text-muted); background: var(--bg); border-radius: 8px;
      padding: 6px 10px; margin-bottom: 10px;
    }
    .net.offline { color: var(--warning-text); background: var(--warning-bg); }
    .net .sync { background: none; border: 1px solid var(--border-strong); color: var(--text-2); border-radius: 6px;
      font-size: 0.72rem; padding: 3px 8px; cursor: pointer; }
    /* Avisos al aplicador (velocidad, parada larga): visibles pero sin tapar nada */
    .warn { display: flex; align-items: center; gap: 10px; background: var(--warning-bg); color: var(--warning-text); border: 1px solid var(--warning-border);
      border-radius: 10px; padding: 8px 12px; margin: -2px 0 10px; font-size: 0.95rem; line-height: 1.35; }
    .warn[hidden] { display: none; }
    .warn .wi { font-size: 1.5rem; line-height: 1; }
    .warn b { color: #fff; font-size: 1.05rem; }
    .warn.speed { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-strong); }
    .warn.speed b { color: #fff; }
    /* Posición del celular: estado del GPS y botones sobre el mapa */
    .gps-chip { position: absolute; top: 10px; left: 10px; z-index: 3; max-width: calc(100% - 80px);
      background: rgba(10, 10, 11, 0.9); color: var(--text); border: 1px solid var(--border); border-radius: 999px;
      padding: 6px 12px; font-size: 0.8rem; font-weight: 600; pointer-events: none; box-shadow: 0 3px 12px rgba(0,0,0,.4); }
    .gps-chip.ok { color: var(--success-text); border-color: var(--success-border); }
    .gps-chip.mid { color: var(--warning-text); border-color: var(--warning-border); }
    .gps-chip.err { color: var(--danger-text); border-color: var(--danger-border); }
    .map-btns { position: absolute; right: 10px; bottom: 12px; z-index: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .map-btns button { min-height: 44px; padding: 0 14px; border-radius: 10px; background: var(--bg); color: var(--text-strong);
      border: 1px solid var(--border-strong); font-weight: 700; font-size: 0.85rem; cursor: pointer; box-shadow: 0 3px 12px rgba(0,0,0,.45); white-space: nowrap; }
    .map-btns button:hover { filter: brightness(1.2); }
    .map-btns button[hidden] { display: none; }
    .gps-help { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); border-radius: 10px; padding: 10px 12px;
      font-size: 0.84rem; line-height: 1.45; margin-bottom: 10px; }
    .gps-help[hidden] { display: none; }
    .gps-help b { color: #fff; }
    .gps-help ul { margin: 6px 0 0 18px; }
    .gps-help li { margin-top: 4px; }
    .gps-help .retry { margin-top: 8px; min-height: 44px; width: 100%; background: var(--danger-border); color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
    /* Pestañas de la lista: pendientes / en curso / finalizados */
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tabs button { flex: 1; min-height: 44px; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); border-radius: 10px;
      font-weight: 700; font-size: 0.82rem; cursor: pointer; padding: 4px 6px; line-height: 1.15; }
    .tabs button.on { background: var(--success-bg); color: var(--success-text); border-color: var(--success); }
    .tabs .cnt { display: inline-block; min-width: 20px; padding: 1px 6px; margin-left: 4px; border-radius: 999px; background: var(--border); color: var(--text); font-size: 0.72rem; }
    .tabs button.on .cnt { background: var(--success); color: var(--on-solid); }
    .job-card .prog { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .job-card .chip { font-size: 0.74rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface); color: var(--text); border: 1px solid var(--border); white-space: nowrap; }
    .job-card .chip.g { color: var(--success-text); border-color: var(--success-border); }
    .job-card .chip.b { color: var(--info-text); border-color: var(--info-border); }
    .job-card .chip.y { color: var(--warning-text); border-color: var(--warning-border); }
    .st-grabando { background: var(--success-bg); color: var(--success-text); }
    .resume-box, .done-box { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success-text); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.88rem; line-height: 1.45; }
    .resume-box[hidden], .done-box[hidden], .stages-box[hidden] { display: none; }
    .resume-box b, .done-box b { color: #fff; }
    .resume-box button { margin-top: 8px; min-height: 44px; width: 100%; background: var(--success-border); color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
    .done-box { background: var(--info-bg); border-color: var(--info-border); color: var(--info-text); }
    .stages-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 0.8rem; }
    .stages-box .st-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 4px; }
    .stages-box .stg { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1px solid var(--surface); color: var(--text-2); }
    .stages-box .stg:first-of-type { border-top: none; }
    .stages-box .stg b { color: var(--text-strong); }
    .stages-box .gain { color: var(--success-text); font-weight: 700; white-space: nowrap; }
    .btn-row + .btn-row { margin-top: 10px; }
    .btn-stage { background: var(--accent); color: var(--on-solid); }
    .btn-finish2 { background: transparent; color: var(--danger-text); border: 2px solid var(--danger-strong); padding: 11px; font-size: 0.95rem; }
    /* Sesión vencida: se pide la contraseña sin salir (el GPS sigue grabando) */
    .relogin { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .relogin-card { width: min(420px, 100%); background: var(--surface, #18181b); border: 1px solid var(--border, #27272a); border-radius: 14px; padding: 18px; color: var(--text, #f4f4f5); }
    .relogin-card h3 { font-size: 1.05rem; margin-bottom: 6px; }
    .relogin-card p { color: var(--text-muted, #a1a1aa); font-size: .9rem; margin-bottom: 12px; line-height: 1.4; }
    .relogin-card label { display: block; font-size: .78rem; color: var(--text-muted, #a1a1aa); margin: 8px 0 4px; }
    .relogin-card input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border-strong, #3f3f46); background: var(--bg, #09090b); color: inherit; font-size: 16px; }
    .relogin-card .rmsg { color: var(--danger-text, #fca5a5); font-size: .85rem; min-height: 1.2em; margin: 8px 0; }
    .relogin-card .btn { width: 100%; }
      .wx-box { margin: 10px 0; background: var(--surface, #121214); border: 1px solid var(--border, #27272a); border-radius: 12px; }
    .wx-box > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .9rem; min-height: 44px; }
    .wx-box > summary::-webkit-details-marker { display: none; }
    .wx-box > summary::after { content: '▾'; margin-left: auto; color: var(--text-muted, #a1a1aa); }
    .wx-box[open] > summary::after { content: '▴'; }
    .wx-box .wx-card { border: none; border-top: 1px solid var(--border, #27272a); border-radius: 0 0 12px 12px; }
    .wx-box .wx-sumtxt { color: var(--text-2, #d4d4d8); font-size: .82rem; }
  </style>
  <link rel="stylesheet" href="responsive.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body class="tracker-page">
  <header>
    <h1><span class="brand-mark" aria-hidden="true"><svg class="i" aria-hidden="true"><use href="icons.svg#i-sprout"/></svg></span><span>Mi recorrido</span></h1>
    <div class="header-right">
      <span id="userName" class="hide-sm" style="font-size:0.85rem;color:var(--text-muted)"></span>
      <span class="role-badge">APLICADOR</span>
      <button class="btn-logout" onclick="openPasswordDialog()" title="Cambiar mi contraseña" aria-label="Cambiar mi contraseña"><svg class="i" aria-hidden="true"><use href="icons.svg#i-key-round"/></svg></button>
      <button class="btn-logout" onclick="logoutTracker()" title="Salir" aria-label="Salir"><svg class="i" aria-hidden="true"><use href="icons.svg#i-log-out"/></svg><span class="lbl">Salir</span></button>
    </div>
  </header>

  <div id="map"></div>

  <div class="bottom-panel">
    <div class="gps-help" id="gpsHelp" role="alert" hidden></div>
    <!-- Lista de trabajos asignados -->
    <div class="view show" id="listView">
      <div class="panel-title">Mis trabajos</div>
      <div class="tabs" id="jobTabs" role="tablist">
        <button type="button" role="tab" data-tab="pendiente">Pendientes<span class="cnt" id="cnt_pendiente">0</span></button>
        <button type="button" role="tab" data-tab="en_curso">En curso<span class="cnt" id="cnt_en_curso">0</span></button>
        <button type="button" role="tab" data-tab="finalizado">Finalizados<span class="cnt" id="cnt_finalizado">0</span></button>
      </div>
      <div class="msg" id="listMsg"></div>
      <div class="job-list" id="jobList"><div class="formula">Cargando…</div></div>
    </div>

    <!-- Trabajo seleccionado -->
    <div class="view" id="jobView">
      <div class="job-head">
        <h2 id="jLot">–</h2>
        <span class="pill" id="jStatus">–</span>
      </div>
      <div class="formula" id="jFormula"></div>
      <div class="notes" id="jNotes"></div>
      <div class="msg" id="jobMsg"></div>
      <div class="net" id="netBox">
        <span id="netText">📶 En línea</span>
        <button class="sync" id="btnSync" style="display:none">Enviar ahora</button>
      </div>
      <div class="status-row">
        <div class="dot" id="dot"></div>
        <span id="statusText">GPS detenido</span>
      </div>
      <div class="warn" id="warnBox" role="status" aria-live="polite" hidden><span class="wi" id="warnIcon"></span><span id="warnText"></span></div>
      <div class="deleted-box" id="deletedBox" style="display:none">🗑️ <b>El supervisor eliminó este trabajo.</b> El GPS dejó de grabar. Lo que ya registraste quedó guardado. Volvé a <b>Mis trabajos</b>.</div>
      <div class="done-box" id="doneBox" hidden></div>
      <div class="resume-box" id="resumeBox" hidden></div>
      <div class="route-box" id="routeBox" style="display:none">
        <div class="route-head"><span>〰️ Avance de la ruta</span><strong id="routePct">0%</strong></div>
        <div class="coverage-bar"><div class="fill" id="routeFill"></div></div>
        <div class="route-next" id="routeNext"></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="val" id="statPoints">0</div><div class="lbl">Puntos GPS</div></div>
        <div class="stat"><div class="val" id="statCoverage">–</div><div class="lbl" id="statCoverageLbl">Zona cubierta</div></div>
        <div class="stat"><div class="val" id="statDistance">0.00</div><div class="lbl">Km</div></div>
      </div>
      <div class="coverage-bar"><div class="fill" id="coverageFill"></div></div>
      <div class="stages-box" id="stagesBox" hidden></div>
      <details class="wx-box" id="wxBox" hidden><summary id="wxSum">🌦️ Clima</summary><div id="wxBody"></div></details>
      <div class="btn-row">
        <button class="btn btn-start" id="btnStart">▶ Iniciar trabajo</button>
        <button class="btn btn-pause" id="btnPause" style="display:none">⏸ Pausar GPS</button>
        <button class="btn btn-stage" id="btnEndStage" style="display:none">⏹ Terminar etapa por hoy</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-finish2" id="btnFinish" style="display:none">■ Finalizar trabajo</button>
      </div>
      <button class="link-btn" id="btnBack">← Mis trabajos</button>
    </div>
  </div>

  <script>
    const session = requireAuth(['aplicador', 'admin']);
    document.getElementById('userName').textContent = session.name || '';

    const STATUS_LABELS = { pendiente: 'Pendiente', en_curso: 'En curso', finalizado: 'Finalizado', cancelado: 'Cancelado' };
    const EMPTY_FC = { type: 'FeatureCollection', features: [] };
    const $ = (id) => document.getElementById(id);
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function showMsg(id, text, type) {
      const el = $(id);
      el.textContent = text;
      el.className = 'msg ' + type;
      if (type === 'ok') setTimeout(() => { el.className = 'msg'; }, 3000);
    }
    function fmtDay(v) {
      if (!v) return 'sin fecha';
      const [y, m, d] = v.split('-');
      return `${d}/${m}/${y}`;
    }
    function formulaText(j) {
      const parts = [];
      if (j.product) parts.push(j.product);
      if (j.dose != null) parts.push(j.dose + ' ' + (j.doseUnit || ''));
      if (j.litersPerHa != null) parts.push('caldo ' + j.litersPerHa + ' l/ha');
      // Producto del catálogo: clase toxicológica (banda) y reingreso, para el EPP y el aviso al personal
      const pi = j.productInfo;
      if (pi && pi.toxClass) parts.push('clase ' + pi.toxClass + (pi.toxColor ? ' (banda ' + pi.toxColor + ')' : ''));
      if (pi && pi.reentryHours != null) parts.push('reingreso ' + pi.reentryHours + ' h');
      return parts.join(' · ') || 'Sin fórmula';
    }
    const fmtLen = (m) => m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m';
    function routeText(j) {
      const lines = routeLines(j.route);
      if (!lines.length) return '';
      const m = lines.reduce((s, l) => s + ZoneGeo.lengthM(l), 0);
      return `〰️ ${lines.length} pasada${lines.length === 1 ? '' : 's'} · ${fmtLen(m)}` + (j.passWidthM ? ` · entrefila ${String(j.passWidthM).replace('.', ',')} m` : '');
    }
    const jobWidth = (j) => (j && j.passWidthM) || ZoneGeo.DEFAULT_PASS_WIDTH_M;
    const jobTolerance = (j) => j.routeToleranceM || DEFAULT_TOLERANCE_M; // trabajos viejos sin tolerancia: 10 m
    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || ('Error ' + res.status));
        err.status = res.status;
        throw err;
      }
      return data;
    }

    // ===== MAPA =====
    mapboxgl.accessToken = '__MAPBOX_TOKEN__';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/satellite-streets-v12',
      center: [-60.7, -33.0],
      zoom: 13,
      attributionControl: false
    });
    map.addControl(new mapboxgl.NavigationControl({ showCompass: true }), 'top-right');
    // Estado del GPS y botones sobre el mapa (la posición del celular la maneja la página: ver "POSICIÓN DEL CELULAR")
    map.getContainer().insertAdjacentHTML('beforeend', `
      <div class="gps-chip" id="gpsChip" aria-live="polite">📡 Buscando señal GPS…</div>
      <div class="map-btns">
        <button type="button" id="btnFitRoute" hidden>〰️ Ver ruta</button>
        <button type="button" id="btnCenter" aria-label="Centrar en mi posición">📍 Centrar en mi posición</button>
      </div>`);

    let mapReady = false;
    const onMapReady = [];
    function whenMapReady(fn) { if (mapReady) fn(); else onMapReady.push(fn); }
    // El alto del mapa cambia al pasar de la lista al trabajo (y al dibujar en el celular):
    // sin esto el canvas queda con el tamaño viejo y el encuadre cae fuera de la parte visible.
    if (window.ResizeObserver) new ResizeObserver(() => map.resize()).observe(map.getContainer());
    map.on('load', () => {
      // Misma estética que el panel del supervisor: la ruta es la protagonista
      RouteLayers.add(map, 't-');
      // Círculo de precisión de la posición del celular
      map.addSource('t-acc', { type: 'geojson', data: EMPTY_FC });
      map.addLayer({ id: 't-acc-fill', type: 'fill', source: 't-acc', paint: { 'fill-color': '#38bdf8', 'fill-opacity': 0.16 } });
      map.addLayer({ id: 't-acc-line', type: 'line', source: 't-acc', paint: { 'line-color': '#38bdf8', 'line-width': 1.5, 'line-opacity': 0.7 } });
      mapReady = true;
      onMapReady.splice(0).forEach(fn => fn());
    });
    const SRC = { zone: 't-zone', coverage: 't-covered', track: 't-track', route: 't-route', acc: 't-acc' };
    function setSource(id, data) { whenMapReady(() => map.getSource(SRC[id] || id).setData(data || EMPTY_FC)); }

    // ===== ESTADO =====
    let jobs = [];
    let current = null;       // trabajo seleccionado
    let zoneFeature = null;
    let trackCoords = [];     // [[lng, lat], ...] en orden de tiempo
    let trackBreaks = new Set(); // índices donde empieza otra etapa
    let newStageBreak = false;   // el próximo punto grabado empieza una etapa nueva
    let stages = [];          // etapas del trabajo abierto
    let recordFrom = 0;       // no se graban posiciones anteriores a esta hora (inicio de etapa / reanudar)
    let discarded = 0;        // puntos descartados por mala precisión en esta sesión
    let watchId = null;
    let userMarker = null;
    let wakeLock = null;
    let routeProgress = null; // avance del recorrido planificado (si el trabajo tiene)
    let nextRun = null;
    let followPausedUntil = 0; // al tocar "próximo tramo" se deja de seguir la posición unos segundos

    // ===== LISTA =====
    // Pestañas: Pendientes / En curso (con etapas) / Finalizados (historial, sólo lectura)
    let activeTab = null;
    const nf0 = (n) => Math.round(Number(n) || 0);
    function fmtDur(sec) {
      sec = Math.max(0, Math.round(sec || 0));
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
      return h ? `${h} h ${String(m).padStart(2, '0')} min` : (m ? `${m} min` : `${sec} s`);
    }
    const p2 = (n) => String(n).padStart(2, '0');
    const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    const fmtHM = (v) => { const d = new Date(v); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
    const fmtDM = (v) => { const d = new Date(v); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1); };
    function fmtDateTime(v) {
      if (!v) return '–';
      return fmtDM(v) + ' ' + fmtHM(v);
    }
    const pctTxt = (v) => v == null ? '–' : nf0(v) + '%';
    async function loadJobs() {
      try {
        const data = await api('GET', '/api/jobs?scope=mine&status=pendiente,en_curso,finalizado');
        jobs = data.jobs;
        if (!activeTab) activeTab = jobs.some(j => j.status === 'en_curso') ? 'en_curso' : 'pendiente';
        renderJobs();
      } catch (e) {
        showMsg('listMsg', e.message, 'error');
      }
    }
    function cardHtml(j) {
      const title = `<span class="lot">${esc(j.lotName || 'Trabajo #' + j.id)}</span>`;
      if (j.status === 'finalizado') {
        return `
        <div class="job-card" data-id="${j.id}">
          <div class="top">${title}<span class="pill st-finalizado">✓ ${fmtDateTime(j.finishedAt)}</span></div>
          <div class="prog">
            ${j.route ? `<span class="chip g">〰️ Ruta ${pctTxt(j.routePct)}</span>` : ''}
            <span class="chip b">🟩 Zona ${pctTxt(j.coveragePct)}</span>
            <span class="chip">⏱ ${fmtDur(j.stagesSeconds)}</span>
            <span class="chip">🧩 ${j.stageCount || 0} etapa${j.stageCount === 1 ? '' : 's'}</span>
          </div>
          <div class="meta">🧪 ${esc(formulaText(j))}</div>
        </div>`;
      }
      if (j.status === 'en_curso') {
        const open = j.openStage;
        const pill = open ? `<span class="pill st-grabando">● Etapa ${open.seq} abierta</span>`
          : `<span class="pill st-en_curso">Sigue otro día</span>`;
        const last = open ? 'Etapa ' + open.seq + ' desde ' + fmtDateTime(open.startedAt)
          : (j.lastStageEndedAt ? 'Última etapa: ' + fmtDateTime(j.lastStageEndedAt) : '');
        return `
        <div class="job-card" data-id="${j.id}">
          <div class="top">${title}${pill}</div>
          <div class="prog">
            ${j.route ? `<span class="chip g">〰️ Ruta ${pctTxt(j.routePct)}</span>` : ''}
            <span class="chip b">🟩 Zona ${pctTxt(j.coveragePct)}</span>
            <span class="chip">🧩 ${j.stageCount || 0} etapa${j.stageCount === 1 ? '' : 's'}</span>
          </div>
          <div class="meta">🧪 ${esc(formulaText(j))}${last ? '<br>🕒 ' + esc(last) : ''}</div>
        </div>`;
      }
      return `
        <div class="job-card" data-id="${j.id}">
          <div class="top">${title}<span class="pill st-${j.status}">${STATUS_LABELS[j.status]}</span></div>
          <div class="meta">🧪 ${esc(formulaText(j))}<br>${routeText(j) ? esc(routeText(j)) + '<br>' : ''}📅 ${fmtDay(j.scheduledDate)}${j.machineName || j.machine ? ' · 🚜 ' + esc(j.machineName || j.machine) : ''}</div>
        </div>`;
    }
    function renderJobs() {
      const list = $('jobList');
      for (const t of ['pendiente', 'en_curso', 'finalizado']) $('cnt_' + t).textContent = jobs.filter(j => j.status === t).length;
      document.querySelectorAll('#jobTabs button').forEach(b => {
        b.classList.toggle('on', b.dataset.tab === activeTab);
        b.setAttribute('aria-selected', b.dataset.tab === activeTab ? 'true' : 'false');
      });
      let shown = jobs.filter(j => j.status === activeTab);
      if (activeTab === 'finalizado') shown = shown.sort((a, b) => new Date(b.finishedAt) - new Date(a.finishedAt));
      if (!shown.length) {
        list.innerHTML = activeTab === 'pendiente'
          ? '<div class="empty">⚠️ No tenés trabajos pendientes. Pedile al supervisor que te asigne uno.</div>'
          : activeTab === 'en_curso' ? '<div class="formula">No tenés trabajos en curso.</div>'
            : '<div class="formula">Todavía no finalizaste ningún trabajo.</div>';
        setSource('zone', EMPTY_FC);
        setSource('route', EMPTY_FC);
        listFc = null;
        updateMapButtons();
        return;
      }
      list.innerHTML = shown.map(cardHtml).join('');
      // Mostrar en el mapa los lotes de la pestaña
      const fc = { type: 'FeatureCollection', features: shown.filter(j => j.geometry).map(j => ({ type: 'Feature', properties: {}, geometry: j.geometry })) };
      setSource('zone', fc);
      setSource('route', { type: 'FeatureCollection', features: shown.filter(j => j.route).map(j => ({ type: 'Feature', properties: { done: false }, geometry: j.route })) });
      // Encuadrar sólo si cambiaron los lotes (la lista se refresca cada 15 s y no hay que mover el mapa)
      const fitKey = JSON.stringify(fc.features.map(f => f.geometry));
      listFc = fc.features.length ? fc : null;
      if (fc.features.length && fitKey !== lastListFit) {
        lastListFit = fitKey;
        frameView();
      }
    }
    $('jobTabs').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-tab]');
      if (!b) return;
      activeTab = b.dataset.tab;
      renderJobs();
    });
    let lastListFit = '';
    let listFc = null; // lotes de la lista (para encuadrar)
    $('jobList').addEventListener('click', (e) => {
      const card = e.target.closest('.job-card');
      if (card) selectJob(Number(card.dataset.id));
    });

    function showView(name) {
      $('listView').classList.toggle('show', name === 'list');
      $('jobView').classList.toggle('show', name === 'job');
    }

    // ===== TRABAJO =====
    async function selectJob(id) {
      try {
        const data = await api('GET', '/api/jobs/' + id);
        current = data.job;
        zoneFeature = { type: 'Feature', properties: {}, geometry: current.geometry };
        $('deletedBox').style.display = 'none';
        stages = data.stages || [];
        const pending = queue.filter(q => q.jobId === current.id).map(q => q.point);
        setTrackPoints(data.points.concat(pending));
        showView('job');
        $('jobMsg').className = 'msg';
        setupRoute();
        renderJob();
        setSource('zone', zoneFeature);
        // Sin animación: una animación larga se cortaba con el primer punto GPS y el mapa quedaba lejos
        const lat = turf.centroid(zoneFeature).geometry.coordinates[1];
        whenMapReady(() => {
          map.resize();
          RouteLayers.setSwath(map, 't-', jobWidth(current), lat);
        });
        frameView(); // la ruta y, si ya hay, la posición del celular
        loadWeather();
        startPreview();
        updateTrackVisual();
      } catch (e) {
        showMsg('listMsg', e.message, 'error');
      }
    }

    // Clima del lote (sólo lectura): estado de la ventana de aplicación y próximas horas
    let wxTimer = null;
    async function loadWeather() {
      clearTimeout(wxTimer);
      const box = $('wxBox');
      if (!current || !['pendiente', 'en_curso'].includes(current.status) || !navigator.onLine) { if (!current || !navigator.onLine) return; box.hidden = true; return; }
      const id = current.id;
      try {
        const an = await api('GET', `/api/weather?jobId=${id}&compact=1`);
        if (!current || current.id !== id) return;
        const C = Clima, cur = an.current || {};
        const ref = an.at && an.at.hour ? an.at : null;
        const st = ref ? ref.status : cur.status;
        $('wxSum').innerHTML = `🌦️ ${C.pill(st, ref ? 'al inicio' : 'ahora')} <span class="wx-sumtxt">Ahora ${C.arrow(cur.dir)} ${C.nf(cur.wind)} km/h${cur.gust != null ? ' · ráf. ' + C.nf(cur.gust) : ''} · ${C.nf(cur.temp, 0)}° · ΔT ${C.nf(cur.deltaT, 1)}${an.now ? '' : an.next ? ' · próxima ventana ' + esc(C.windowText(an.next)) : ''}</span>`;
        $('wxBody').innerHTML = C.card(an, { title: 'Clima en el lote', mark: current.status === 'pendiente' ? current.plannedStartAt : null, plan: current.status === 'pendiente', hoursAhead: 18 });
        box.hidden = false;
      } catch (e) { /* sin pronóstico: no se muestra (no molesta al trabajo) */ }
      wxTimer = setTimeout(loadWeather, 30 * 60 * 1000);
    }

    // Recorrido: puntos ordenados; cada etapa se dibuja como un tramo aparte (no se une el final de
    // una con el comienzo de la siguiente)
    function setTrackPoints(points) {
      const pts = points.slice().sort((a, b) => a.ts - b.ts);
      trackCoords = pts.map(p => [p.lng, p.lat]);
      trackBreaks = new Set();
      let prev;
      pts.forEach((p, i) => {
        if (i > 0 && p.stage != null && prev != null && p.stage !== prev) trackBreaks.add(i);
        if (p.stage != null) prev = p.stage;
      });
      newStageBreak = false;
    }
    function trackParts() {
      const parts = [];
      let cur = [];
      trackCoords.forEach((c, i) => {
        if (trackBreaks.has(i) && cur.length) { parts.push(cur); cur = []; }
        cur.push(c);
      });
      if (cur.length) parts.push(cur);
      return parts.filter(p => p.length >= 2);
    }
    const methodLabel = (j) => j.applicationMethod && AlertsCore.METHODS[j.applicationMethod] ? AlertsCore.METHODS[j.applicationMethod].label : '';
    const jobLimit = (j) => AlertsCore.jobSpeedLimit(j, alertSettings);
    // Etapa abierta que quedó vieja (se olvidó de terminarla): la próxima vez empieza una nueva
    const STALE_STAGE_MS = 3 * 3600 * 1000;
    function openStageStale() {
      const o = current && current.openStage;
      if (!o) return false;
      const last = Math.max(new Date(o.startedAt).getTime(), current.lastPointAt ? new Date(current.lastPointAt).getTime() : 0,
        current.pausedAt ? new Date(current.pausedAt).getTime() : 0);
      return Date.now() - last > STALE_STAGE_MS;
    }
    function renderStages() {
      const box = $('stagesBox');
      if (!current || !stages.length) { box.hidden = true; return; }
      box.hidden = false;
      box.innerHTML = `<div class="st-title">🧩 Etapas (${stages.length})</div>` + stages.map(st => {
        const open = !st.endedAt;
        const when = DOW[new Date(st.startedAt).getDay()] + ' ' + fmtDM(st.startedAt) + ' ' + fmtHM(st.startedAt) + (open ? '' : '–' + fmtHM(st.endedAt));
        const dist = st.distanceM != null ? fmtLen(st.distanceM) : '';
        const gain = st.routePctGained != null && current.route ? `+${nf1(st.routePctGained)}%` : '';
        return `<div class="stg"><span><b>Etapa ${st.seq}</b> · ${esc(when)} · ${open ? 'en curso' : fmtDur(st.durationS)}${dist ? ' · ' + dist : ''}</span><span class="gain">${open ? '●' : gain}</span></div>`;
      }).join('');
    }
    function renderJob() {
      $('jLot').textContent = current.lotName || 'Trabajo #' + current.id;
      $('jStatus').textContent = STATUS_LABELS[current.status];
      $('jStatus').className = 'pill st-' + current.status;
      $('jFormula').textContent = '🧪 ' + formulaText(current) + ' · 📅 ' + fmtDay(current.scheduledDate);
      const method = methodLabel(current);
      $('jNotes').textContent = [current.machine ? '🚜 ' + current.machine : '', (method ? method + ' · ' : '') + 'máx. ' + nf1(jobLimit(current)) + ' km/h',
        current.notes ? '📝 ' + current.notes : ''].filter(Boolean).join(' · ');
      const tracking = watchId !== null;
      const start = $('btnStart');
      renderStages();
      const closed = !['pendiente', 'en_curso'].includes(current.status);
      if (current.deleted || closed) {
        ['btnStart', 'btnPause', 'btnEndStage', 'btnFinish'].forEach(id => { $(id).style.display = 'none'; });
        $('dot').classList.remove('active');
        $('resumeBox').hidden = true;
        $('statusText').textContent = current.deleted ? 'Trabajo eliminado – GPS detenido' : 'Trabajo ' + STATUS_LABELS[current.status].toLowerCase() + ' · sólo lectura';
        renderDoneBox();
        return;
      }
      $('doneBox').hidden = true;
      const open = current.openStage && !openStageStale();
      const nextSeq = (current.stageCount || 0) + 1;
      start.style.display = tracking ? 'none' : '';
      start.textContent = current.status === 'pendiente' ? '▶ Iniciar trabajo'
        : (open ? `▶ Reanudar GPS (etapa ${current.openStage.seq})` : `▶ Iniciar etapa ${nextSeq}`);
      start.disabled = false;
      $('btnPause').style.display = tracking ? '' : 'none';
      $('btnEndStage').style.display = current.status === 'en_curso' && (tracking || open) ? '' : 'none';
      $('btnFinish').style.display = current.status === 'en_curso' ? '' : 'none';
      $('dot').classList.toggle('active', tracking);
      if (!tracking) {
        $('statusText').textContent = current.status === 'pendiente' ? 'Listo para iniciar'
          : open ? `GPS en pausa – etapa ${current.openStage.seq} abierta · ${trackCoords.length} puntos`
            : `Entre etapas – ${trackCoords.length} puntos en ${current.stageCount || 0} etapa${current.stageCount === 1 ? '' : 's'}`;
      }
      renderResumeBox(tracking);
    }
    // Al volver a un trabajo en curso: qué falta de la ruta, bien visible
    function renderResumeBox(tracking) {
      const box = $('resumeBox');
      if (tracking || current.status !== 'en_curso' || !(current.stageCount > 0) || (current.openStage && !openStageStale())) { box.hidden = true; return; }
      const stale = current.openStage && openStageStale();
      let txt = `🧭 <b>Seguís desde donde dejaste.</b> `;
      if (routeProgress) {
        routeProgress.setTrack(trackCoords); // al abrir el trabajo todavía no se había aplicado el recorrido
        const sm = routeProgress.summary();
        const rem = routeProgress.remaining();
        txt += `Hecho <b>${nf0(sm.pct)}%</b> de la ruta · faltan <b>${fmtLen(sm.remainingM)}</b> en ${rem.length} tramo${rem.length === 1 ? '' : 's'} (en el mapa, la ruta gris es lo que falta).`;
      } else {
        txt += `Llevás ${trackCoords.length} puntos registrados.`;
      }
      if (stale) txt += `<br>La etapa ${current.openStage.seq} quedó abierta desde el ${fmtDateTime(current.openStage.startedAt)}: se cierra sola al empezar la nueva.`;
      else if (current.lastStageEndedAt) txt += `<br>Última etapa terminada: ${fmtDateTime(current.lastStageEndedAt)}.`;
      box.innerHTML = txt + (routeProgress && routeProgress.remaining().length ? '<button type="button" id="btnShowLeft">👁 Ver lo que falta</button>' : '');
      box.hidden = false;
    }
    $('resumeBox').addEventListener('click', (e) => {
      if (!e.target.closest('#btnShowLeft') || !routeProgress) return;
      const rem = routeProgress.remaining();
      if (!rem.length) return;
      followPausedUntil = Date.now() + 15000;
      const fc = { type: 'FeatureCollection', features: rem.map(r => turf.lineString(r.coords)) };
      whenMapReady(() => map.fitBounds(turf.bbox(fc), { padding: 50, maxZoom: 18 }));
    });
    // Trabajo finalizado (historial): resumen, sólo lectura
    function renderDoneBox() {
      const box = $('doneBox');
      if (current.deleted || current.status !== 'finalizado') { box.hidden = true; return; }
      box.innerHTML = `✅ <b>Finalizado el ${fmtDateTime(current.finishedAt)}</b><br>` +
        (current.route ? `〰️ Ruta <b>${pctTxt(current.routePct)}</b> · ` : '') + `🟩 Zona cubierta <b>${pctTxt(current.coveragePct)}</b><br>` +
        `⏱ ${fmtDur(current.stagesSeconds)} en ${current.stageCount || 0} etapa${current.stageCount === 1 ? '' : 's'} · ${trackCoords.length} puntos GPS<br>` +
        `<span style="color:var(--info-text)">En el mapa: ruta planificada (verde = hecha) y tu recorrido.</span>`;
      box.hidden = false;
    }

    function setupRoute() {
      routeProgress = current && current.route ? new RouteProgress(current.route, jobTolerance(current)) : null;
      if (routeProgress && routeProgress.empty) routeProgress = null;
      $('routeBox').style.display = routeProgress ? '' : 'none';
      if (!routeProgress) setSource('route', EMPTY_FC);
    }

    function updateRouteVisual() {
      if (!routeProgress) return;
      routeProgress.setTrack(trackCoords);
      const sm = routeProgress.summary();
      $('routePct').textContent = sm.pct.toFixed(0) + '%';
      $('routeBox').title = `${fmtLen(sm.doneM)} de ${fmtLen(sm.totalM)}`;
      $('routeFill').style.width = sm.pct + '%';
      setSource('route', routeProgress.toGeoJSON());
      const rem = routeProgress.remaining();
      if (!rem.length) {
        nextRun = null;
        $('routeNext').textContent = '✅ Ruta completa';
        return;
      }
      // Tramo pendiente más cercano a la posición actual (o el primero si todavía no hay GPS)
      const here = trackCoords[trackCoords.length - 1];
      nextRun = rem[0];
      let best = Infinity;
      if (here) {
        for (const r of rem) {
          const d = Math.min(turf.distance(here, r.start, { units: 'meters' }), turf.distance(here, r.coords[r.coords.length - 1], { units: 'meters' }));
          if (d < best) { best = d; nextRun = r; }
        }
      }
      const left = sm.remainingM >= 1000 ? (sm.remainingM / 1000).toFixed(2) + ' km' : Math.round(sm.remainingM) + ' m';
      $('routeNext').textContent = `Faltan ${left} · Próximo tramo: pasada ${nextRun.pass}` +
        (Number.isFinite(best) ? `, a ${Math.round(best)} m` : '') + ' (tocá para verlo)';
    }
    $('routeNext').addEventListener('click', () => {
      if (nextRun) followPausedUntil = Date.now() + 8000;
      if (nextRun) whenMapReady(() => map.fitBounds(turf.bbox(turf.lineString(nextRun.coords)), { padding: 60, maxZoom: 18 }));
    });

    function updateTrackVisual() {
      updateRouteVisual();
      $('statPoints').textContent = trackCoords.length;
      if (trackCoords.length < 2) {
        setSource('track', EMPTY_FC);
        setSource('coverage', EMPTY_FC);
        $('statDistance').textContent = '0.00';
        $('statCoverage').textContent = '–';
        $('coverageFill').style.width = '0%';
        return;
      }
      const parts = trackParts();
      const line = parts.length ? turf.multiLineString(parts) : EMPTY_FC;
      setSource('track', line);
      $('statDistance').textContent = (parts.length ? turf.length(line, { units: 'kilometers' }) : 0).toFixed(2);
      // Zona cubierta: la final si el trabajo terminó; si no, aproximada en vivo (como mucho cada 5 s)
      let cov;
      if (current && current.status === 'finalizado' && current.coveredAt) {
        cov = { pct: current.coveragePct || 0, geometry: current.coveredGeometry, final: true };
      } else {
        if (!lastCov || lastCov.jobId !== (current && current.id) || (trackCoords.length !== lastCov.n && Date.now() - lastCov.at > 5000)) {
          const groups = trackBreaks.size ? trackParts() : trackCoords;
          lastCov = { ...ZoneGeo.coveredZone(groups, jobWidth(current), zoneFeature && zoneFeature.geometry), jobId: current && current.id, n: trackCoords.length, at: Date.now() };
        }
        cov = lastCov;
      }
      setSource('coverage', cov.geometry ? { type: 'Feature', properties: {}, geometry: cov.geometry } : EMPTY_FC);
      $('statCoverage').textContent = cov.pct.toFixed(1) + '%';
      $('statCoverageLbl').textContent = cov.final ? 'Zona cubierta (final)' : 'Zona cubierta';
      $('coverageFill').style.width = cov.pct + '%';
    }
    let lastCov = null;

    // ===== COLA OFFLINE DE PUNTOS =====
    // Cada punto se guarda primero en localStorage y se envía en lotes. Si no hay señal,
    // quedan guardados (aunque se cierre la página) y se mandan cuando vuelve la conexión.
    // Cada punto lleva un id propio, así el servidor ignora los reenvíos duplicados.
    const QUEUE_KEY = 'chaman_gps_cola_v1';
    const QUEUE_MAX = 20000;
    const BATCH_SIZE = 200;
    let queue = loadQueue();
    // Sólo se envían los puntos del usuario logueado (si el celular es compartido, los demás esperan)
    const mine = (q) => q.userId === undefined || q.userId === session.id;
    let flushing = false;
    let flushTimer = null;
    let retryDelay = 3000;
    let lastSendOk = true;

    function loadQueue() {
      try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; } catch { return []; }
    }
    function saveQueue() {
      try {
        localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
      } catch (_) {
        // Almacenamiento lleno: se descartan los puntos más viejos
        queue = queue.slice(-Math.floor(queue.length / 2));
        try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); } catch (_) {}
      }
    }
    function newPointId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }
    function enqueuePoint(jobId, point) {
      queue.push({ userId: session.id, jobId, point: { id: newPointId(), ...point } });
      if (queue.length > QUEUE_MAX) queue = queue.slice(-QUEUE_MAX);
      saveQueue();
      updateNetBox();
      scheduleFlush(2000);
    }
    function scheduleFlush(delay) {
      if (flushTimer) return;
      flushTimer = setTimeout(() => { flushTimer = null; flushQueue(); }, delay);
    }

    async function flushQueue() {
      // Primero los avisos (inicio/fin de etapa, pausas): los puntos van a la etapa que corresponde
      if (ctlQueue.some(mine)) { try { await flushControls(); } catch (_) {} }
      const blocked = new Set(ctlQueue.filter(mine).map(c => c.jobId));
      const ready = (q) => mine(q) && !blocked.has(q.jobId);
      if (flushing || !queue.some(ready)) { updateNetBox(); return; }
      flushing = true;
      try {
        while (queue.some(ready)) {
          const jobId = queue.find(ready).jobId;
          const batch = queue.filter(q => ready(q) && q.jobId === jobId).slice(0, BATCH_SIZE);
          let res;
          try {
            res = await fetch(`/api/jobs/${jobId}/track`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ points: batch.map(q => q.point) })
            });
          } catch (_) {
            res = null; // sin conexión
          }
          if (res && res.status === 401) { lastSendOk = false; break; } // auth.js redirige al login; la cola queda guardada
          if (!res || res.status >= 500 || res.status === 429) {
            lastSendOk = false;
            scheduleFlush(retryDelay);
            retryDelay = Math.min(retryDelay * 2, 60000);
            break;
          }
          const sent = new Set(batch.map(q => q.point.id));
          if (res.status === 410 || res.headers.get('content-type') && res.ok && (await res.clone().json().catch(() => ({}))).deleted) {
            if (current && current.id === jobId) onJobDeleted();
          }
          if (!res.ok && res.status !== 410) {
            // 403/404/409: el trabajo no acepta más puntos (cancelado, reasignado, etc.): se descartan
            const data = await res.json().catch(() => ({}));
            if (current && current.id === jobId) showMsg('jobMsg', (data.error || 'El servidor rechazó puntos') + ' (se descartaron ' + batch.length + ' puntos)', 'error');
          }
          queue = queue.filter(q => !sent.has(q.point.id));
          saveQueue();
          lastSendOk = true;
          retryDelay = 3000;
        }
      } finally {
        flushing = false;
        updateNetBox();
      }
    }

    function updateNetBox() {
      const n = queue.filter(mine).length;
      const offline = !navigator.onLine || !lastSendOk;
      const box = $('netBox');
      if (!box) return;
      box.classList.toggle('offline', offline && n > 0);
      $('netText').textContent = offline
        ? (n ? `📴 Sin conexión – ${n} puntos guardados en el celular` : '📴 Sin conexión')
        : (n ? `📶 Enviando… ${n} puntos pendientes` : '📶 En línea – todo enviado');
      $('btnSync').style.display = n ? '' : 'none';
    }

    window.addEventListener('online', () => { retryDelay = 3000; flushQueue(); });
    window.addEventListener('offline', updateNetBox);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) flushQueue(); });
    setInterval(() => { if (queue.some(mine) || ctlQueue.some(mine)) flushQueue(); }, 15000);

    // ===== SESIÓN VENCIDA =====
    // Si el servidor responde 401 no se sale de la página: el GPS sigue grabando en la cola del celular
    // y se pide la contraseña ahí mismo. Al volver a entrar se envía todo lo pendiente.
    window.chamanOnUnauthorized = openRelogin;
    function openRelogin() {
      lastSendOk = false; updateNetBox();
      if ($('reloginBox')) return;
      const n = queue.filter(mine).length + ctlQueue.filter(mine).length;
      const box = document.createElement('div');
      box.id = 'reloginBox'; box.className = 'relogin';
      box.innerHTML = `<form class="relogin-card" autocomplete="on">
        <h3>Tu sesión se cerró</h3>
        <p>El GPS sigue grabando en el celular${n ? ` (${n} datos guardados)` : ''}. Ingresá tu contraseña para seguir enviando: no se pierde nada.</p>
        <label for="rlUser">Usuario</label><input id="rlUser" name="username" autocomplete="username" value="${esc(session.username || '')}" />
        <label for="rlPass">Contraseña</label><input id="rlPass" name="password" type="password" autocomplete="current-password" required />
        <div class="rmsg" id="rlMsg"></div>
        <button class="btn btn-start" type="submit">Ingresar y enviar</button>
      </form>`;
      document.body.appendChild(box);
      setTimeout(() => $('rlPass').focus(), 50);
      box.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = box.querySelector('button'); btn.disabled = true; btn.textContent = 'Ingresando…';
        const r = await login($('rlUser').value, $('rlPass').value);
        btn.disabled = false; btn.textContent = 'Ingresar y enviar';
        if (!r.ok) { $('rlMsg').textContent = r.error; return; }
        if (r.session.id !== session.id) { location.reload(); return; } // otro usuario: sus datos esperan en la cola
        box.remove();
        lastSendOk = true; retryDelay = 3000;
        flushQueue();
      });
    }

    // ===== AVISOS AL APLICADOR =====
    // Con los mismos umbrales que las alertas del supervisor (los define el admin).
    // Se usan sólo los puntos de esta sesión de grabación (desde el último ▶).
    let alertSettings = null;
    let sessionPts = [];
    let warnState = null;
    async function loadAlertSettings() {
      try { alertSettings = (await api('GET', '/api/alerts/settings')).settings; } catch (_) {}
    }
    const nf1 = (n) => Number(n).toLocaleString('es-AR', { maximumFractionDigits: 1 });
    function checkWarnings() {
      const box = $('warnBox');
      if (!current || watchId === null || current.status !== 'en_curso' || !window.AlertsCore) { box.hidden = true; warnState = null; return; }
      const cfg = AlertsCore.normalizeSettings(alertSettings).value;
      cfg.speed.maxKmh = jobLimit(current); // velocidad máxima del trabajo (método de aplicación)
      const ov = AlertsCore.currentOverspeed(sessionPts, cfg);
      // Aviso a los 10 s (o antes si el umbral es menor), para corregir antes de que se genere la alerta
      if (ov && ov.points >= 2 && ov.sinceS >= Math.min(10, cfg.speed.sustainSec)) {
        box.className = 'warn speed';
        $('warnIcon').textContent = '🐢';
        $('warnText').innerHTML = `<b>Bajá la velocidad: ${nf1(ov.kmh)} km/h</b>, máximo ${nf1(ov.limitKmh)}`;
        box.hidden = false;
        if (warnState !== 'speed' && navigator.vibrate) navigator.vibrate(200);
        warnState = 'speed';
        return;
      }
      const st = AlertsCore.currentStop(sessionPts, cfg);
      if (st && st.minutes >= st.limitMin) {
        box.className = 'warn';
        $('warnIcon').textContent = '🛑';
        $('warnText').innerHTML = `<b>Llevás ${Math.floor(st.minutes)} min detenido.</b> Si es una pausa, tocá “⏸ Pausar GPS”.`;
        box.hidden = false;
        warnState = 'stop';
        return;
      }
      box.hidden = true;
      warnState = null;
    }
    setInterval(checkWarnings, 5000);

    // ===== PAUSAS DEL GPS =====
    // Pausar / reanudar se informa al servidor (así no hay alertas de parada ni de falta de señal
    // mientras está en pausa). Si no hay conexión, queda en una cola con la hora real y se manda después.
    const CTL_KEY = 'chaman_gps_ctl_v1';
    let ctlQueue = (() => { try { return JSON.parse(localStorage.getItem(CTL_KEY)) || []; } catch { return []; } })();
    let ctlFlushing = null;
    function saveCtl() { try { localStorage.setItem(CTL_KEY, JSON.stringify(ctlQueue.slice(-200))); } catch (_) {} }
    function sendControl(action) {
      if (!current || current.status !== 'en_curso') return;
      ctlQueue.push({ userId: session.id, jobId: current.id, action, at: Date.now() });
      saveCtl();
      flushControls();
    }
    function flushControls() {
      if (ctlFlushing) return ctlFlushing;
      ctlFlushing = (async () => {
        try {
          while (ctlQueue.some(mine)) {
            const c = ctlQueue.find(mine);
            let res;
            try {
              res = await fetch(`/api/jobs/${c.jobId}/${c.action}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ at: c.at })
              });
            } catch (_) { res = null; }
            if (!res || res.status >= 500 || res.status === 429 || res.status === 401) break; // se reintenta después
            ctlQueue = ctlQueue.filter(x => x !== c); // ok, o el trabajo ya no lo acepta (403/404/409/410)
            saveCtl();
            if (c.action === 'start' || c.action === 'stage-end') {
              const data = await res.json().catch(() => ({}));
              if (current && current.id === c.jobId) {
                if (!res.ok) showMsg('jobMsg', (data.error || 'No se pudo iniciar la etapa') + '. Lo grabado sin conexión no se pudo guardar en una etapa.', 'error');
                else if (data.job) { current = { ...current, ...data.job }; if (data.stages) stages = data.stages; renderJob(); }
              }
            }
          }
        } finally { ctlFlushing = null; }
      })();
      return ctlFlushing;
    }

    // ===== POSICIÓN DEL CELULAR =====
    // Apenas se abre la página se pide la ubicación (alta precisión) sólo para mostrarla en el mapa:
    // punto "estás acá", círculo de precisión y estado. NO se graba nada hasta tocar ▶ Iniciar.
    let myPos = null;          // { lng, lat, acc, t }
    let previewWatch = null;   // seguimiento sólo para mostrar (cuando no se está grabando)
    let gpsBlocked = false;    // permiso denegado / sin https: no reintentar solo
    let framedWithPos = false; // ya se encuadró con la primera posición
    let recFirstFix = false;   // primera posición de la grabación (centrar y acercar)
    const NEAR_KM = 3;         // si el lote está a menos de esto, se encuadran los dos

    function geoProblem() {
      if (!window.isSecureContext) return 'https';
      if (!navigator.geolocation) return 'unsupported';
      return null;
    }
    function setChip(text, cls) { const c = $('gpsChip'); c.textContent = text; c.className = 'gps-chip' + (cls ? ' ' + cls : ''); }
    const HOW_TO = `<ul>
        <li><b>iPhone (Safari):</b> Ajustes › Privacidad y seguridad › Localización: activada, y Ajustes › Safari › Ubicación: “Preguntar” o “Permitir”. En Safari también: botón <b>aA</b> de la barra › Configuración del sitio web › Ubicación › Permitir.</li>
        <li><b>Android (Chrome):</b> tocá el candado 🔒 junto a la dirección › Permisos › Ubicación › Permitir. Y prendé la Ubicación del teléfono (deslizá desde arriba › Ubicación).</li>
      </ul>`;
    function showGpsHelp(kind) {
      const box = $('gpsHelp');
      let html;
      if (kind === 'https') html = `<b>📵 El GPS sólo funciona con conexión segura (https://).</b> Abrí la app desde la dirección que empieza con <b>https://</b> (no http://).`;
      else if (kind === 'unsupported') html = `<b>📵 Este navegador no permite usar el GPS.</b> Usá Safari en iPhone o Chrome en Android.`;
      else if (kind === 'denied') html = `<b>📵 No hay permiso para usar tu ubicación.</b> Sin ubicación no se puede registrar el recorrido. Para activarla:` + HOW_TO + `Después volvé a esta página y tocá “Reintentar” (si no aparece la pregunta, recargá la página).`;
      else if (kind === 'unavailable') html = `<b>📡 No se pudo obtener tu posición.</b> Prendé la Ubicación del teléfono y, si estás bajo techo, salí a cielo abierto.` + HOW_TO;
      else html = `<b>⏳ El GPS está tardando en responder.</b> Seguimos buscando. Salí a cielo abierto y esperá unos segundos.`;
      const retry = kind === 'timeout' || kind === 'unavailable' || kind === 'denied';
      box.innerHTML = html + (retry ? '<button type="button" class="retry" id="btnGpsRetry">🔄 Reintentar</button>' : '');
      box.hidden = false;
      box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); // que se vea aunque el panel esté desplazado
    }
    function hideGpsHelp() { $('gpsHelp').hidden = true; }
    $('gpsHelp').addEventListener('click', (e) => {
      if (!e.target.closest('#btnGpsRetry')) return;
      gpsBlocked = false;
      hideGpsHelp();
      stopPreview();
      if (watchId === null) startPreview(); else setChip('📡 Buscando señal GPS…');
    });

    function onGeoError(err, recording) {
      if (err.code === 1) { // permiso denegado
        gpsBlocked = true;
        stopPreview();
        setChip('📵 Ubicación sin permiso', 'err');
        showGpsHelp(geoProblem() || 'denied');
        if (recording) stopGps();
      } else if (err.code === 2) {
        setChip('📡 Sin posición – buscando…', 'err');
        showGpsHelp('unavailable');
      } else { // timeout: el seguimiento sigue intentando
        setChip(myPos ? `📍 ±${Math.round(myPos.acc)} m (esperando señal…)` : '📡 Buscando señal GPS…', 'mid');
        if (!myPos) showGpsHelp('timeout');
      }
      if (recording) $('statusText').textContent = err.code === 3 ? 'Buscando señal GPS… (salí a cielo abierto)' : 'Sin señal GPS';
    }

    function updateMyPos(coords, ts) {
      const lngLat = [coords.longitude, coords.latitude];
      const acc = Number(coords.accuracy) || 0;
      myPos = { lng: lngLat[0], lat: lngLat[1], acc, t: ts || Date.now() };
      hideGpsHelp();
      if (!userMarker) {
        const el = document.createElement('div');
        el.className = 'pos-dot';
        el.title = 'Estás acá';
        userMarker = new mapboxgl.Marker(el).setLngLat(lngLat).addTo(map);
      } else {
        userMarker.setLngLat(lngLat);
      }
      setSource('acc', acc > 0 ? turf.circle(lngLat, Math.min(acc, 2000) / 1000, { steps: 48, units: 'kilometers' }) : EMPTY_FC);
      const km = lotKm();
      setChip(`📍 Estás acá · precisión ±${Math.round(acc)} m` + (km > NEAR_KM ? ` · el lote está a ${fmtKm(km)}` : ''), acc <= 15 ? 'ok' : acc <= 50 ? 'mid' : 'err');
      if (!framedWithPos) { framedWithPos = true; frameView(); }
    }

    function startPreview() {
      if (previewWatch !== null || watchId !== null || gpsBlocked) return;
      const prob = geoProblem();
      if (prob) { gpsBlocked = true; setChip('📵 GPS no disponible', 'err'); showGpsHelp(prob); return; }
      if (!myPos) setChip('📡 Buscando señal GPS…');
      previewWatch = navigator.geolocation.watchPosition(
        (p) => updateMyPos(p.coords, p.timestamp),
        (err) => onGeoError(err, false),
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
      );
    }
    function stopPreview() {
      if (previewWatch !== null) { navigator.geolocation.clearWatch(previewWatch); previewWatch = null; }
    }

    // Qué encuadrar: el lote/ruta del trabajo abierto, o los lotes de la lista
    function frameFeature() {
      if (current && zoneFeature && zoneFeature.geometry) {
        return current.route ? { type: 'FeatureCollection', features: [zoneFeature, { type: 'Feature', properties: {}, geometry: current.route }] } : zoneFeature;
      }
      return current ? null : listFc;
    }
    // Distancia (km) de la posición al centro del lote/ruta que se está mirando
    function lotKm() {
      const fc = frameFeature();
      if (!fc || !myPos) return 0;
      const bb = turf.bbox(fc);
      return turf.distance([myPos.lng, myPos.lat], [(bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2], { units: 'kilometers' });
    }
    function fmtKm(km) { return (km < 10 ? km.toFixed(1).replace('.', ',') : Math.round(km)) + ' km'; }
    function updateMapButtons() {
      const fc = frameFeature();
      $('btnFitRoute').hidden = !fc;
      $('btnFitRoute').textContent = current ? (current.route ? '〰️ Ver ruta' : '🗺️ Ver lote') : '🗺️ Ver lotes';
    }
    // Encuadre: si hay posición y el lote está cerca, se ven los dos; si está lejos, se centra en la
    // posición (y "Ver ruta" muestra el lote); sin posición, como antes: el lote.
    function frameView() {
      updateMapButtons();
      whenMapReady(() => {
        const fc = frameFeature();
        if (!myPos) { if (fc) map.fitBounds(turf.bbox(fc), { padding: 50, maxZoom: 17, duration: 0 }); return; }
        const here = [myPos.lng, myPos.lat];
        if (!fc) { map.jumpTo({ center: here, zoom: Math.max(map.getZoom(), 17) }); return; }
        const bb = turf.bbox(fc);
        if (lotKm() > NEAR_KM) {
          map.jumpTo({ center: here, zoom: 17 });
        } else {
          map.fitBounds([[Math.min(bb[0], here[0]), Math.min(bb[1], here[1])], [Math.max(bb[2], here[0]), Math.max(bb[3], here[1])]], { padding: 60, maxZoom: 18, duration: 0 });
        }
      });
    }
    $('btnCenter').addEventListener('click', () => {
      followPausedUntil = 0;
      if (myPos) { whenMapReady(() => map.easeTo({ center: [myPos.lng, myPos.lat], zoom: Math.max(map.getZoom(), 17), duration: 600 })); return; }
      // Todavía no hay posición: pedirla de nuevo
      gpsBlocked = false;
      hideGpsHelp();
      framedWithPos = false; // centrar apenas llegue
      if (watchId === null) { stopPreview(); startPreview(); }
      else setChip('📡 Buscando señal GPS…');
    });
    $('btnFitRoute').addEventListener('click', () => {
      const fc = frameFeature();
      if (!fc) return;
      followPausedUntil = Date.now() + 15000; // mientras graba, que no vuelva enseguida a la posición
      whenMapReady(() => map.fitBounds(turf.bbox(fc), { padding: 50, maxZoom: 18 }));
    });

    // ===== GPS =====
    // Calidad del GPS (la configura el admin): primera posición buena para empezar y descarte de las malas
    function gpsCfg() { return AlertsCore.normalizeSettings(alertSettings).value.gps; }
    function onPosition(pos) {
      const { latitude, longitude, accuracy, speed } = pos.coords;
      updateMyPos(pos.coords, pos.timestamp);
      const ts = pos.timestamp || Date.now();
      const acc = Number(accuracy) || 0;
      const g = gpsCfg();
      // Posición guardada de antes de tocar ▶ (caché del celular): no se graba
      if (ts < recordFrom) { $('statusText').textContent = 'Esperando una posición nueva del GPS…'; return; }
      if (!recFirstFix && acc > g.firstFixM) {
        $('statusText').textContent = `Esperando mejor señal GPS… ±${Math.round(acc)} m (para empezar hace falta ±${g.firstFixM} m o menos)`;
        setChip(`📡 Esperando mejor señal GPS… ±${Math.round(acc)} m`, 'mid');
        return;
      }
      if (acc > g.maxAccuracyM) {
        discarded++;
        $('statusText').textContent = `Señal GPS débil (±${Math.round(acc)} m): no se graba hasta que mejore (máx. ±${g.maxAccuracyM} m)`;
        return;
      }
      const lngLat = [longitude, latitude];
      if (newStageBreak && trackCoords.length) trackBreaks.add(trackCoords.length);
      newStageBreak = false;
      trackCoords.push(lngLat);
      const firstFix = !recFirstFix;
      recFirstFix = true;
      if (firstFix || Date.now() >= followPausedUntil) {
        map.easeTo({ center: lngLat, zoom: firstFix ? Math.max(map.getZoom(), 17) : map.getZoom(), duration: firstFix ? 0 : 800 });
      }
      updateTrackVisual();
      $('statusText').textContent = 'Recorriendo… registrando GPS (±' + Math.round(acc) + ' m)' +
        (current.openStage ? ' · etapa ' + current.openStage.seq : '') + (discarded ? ` · ${discarded} descartados por mala señal` : '');
      enqueuePoint(current.id, { lat: latitude, lng: longitude, accuracy, speed, ts });
      sessionPts.push({ t: ts, lat: latitude, lng: longitude, speed, acc: accuracy });
      if (sessionPts.length > 3000) sessionPts = sessionPts.slice(-2000);
      checkWarnings();
    }

    async function requestWakeLock() {
      try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
    }

    function startGps(from) {
      const prob = geoProblem();
      if (prob) { showGpsHelp(prob); return; }
      stopPreview();
      gpsBlocked = false;
      recFirstFix = false;
      discarded = 0;
      recordFrom = from || Date.now();
      followPausedUntil = 0;
      // maximumAge 0: siempre una lectura nueva (nada de posiciones viejas guardadas en el celular)
      watchId = navigator.geolocation.watchPosition(
        onPosition,
        (err) => onGeoError(err, true),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
      );
      requestWakeLock();
      sessionPts = [];
      // Centrar ya en la última posición conocida (la grabación arranca con la próxima lectura)
      if (myPos) whenMapReady(() => map.jumpTo({ center: [myPos.lng, myPos.lat], zoom: Math.max(map.getZoom(), 17) }));
      else setChip('📡 Buscando señal GPS…');
      renderJob();
      $('statusText').textContent = 'Buscando señal GPS…';
    }
    // ¿No hay permiso de ubicación? Si ya lo negó antes, se vuelve a pedir una posición (puede que lo
    // haya activado en Ajustes); si no, se consulta al navegador (no todos lo informan).
    async function geoDenied() {
      if (gpsBlocked) {
        return new Promise((resolve) => navigator.geolocation.getCurrentPosition(
          (p) => { gpsBlocked = false; updateMyPos(p.coords, p.timestamp); resolve(false); },
          (err) => resolve(err.code === 1),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        ));
      }
      try { return navigator.permissions && (await navigator.permissions.query({ name: 'geolocation' })).state === 'denied'; }
      catch (_) { return false; }
    }

    function stopGps() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
      if (current) renderJob();
      checkWarnings();
      startPreview(); // seguir mostrando la posición (sin grabar)
    }
    // Pausa pedida por el aplicador (botón, volver a la lista, salir): se informa al servidor
    function pauseGps() {
      const wasTracking = watchId !== null;
      stopGps();
      if (wasTracking) sendControl('pause');
    }

    $('btnStart').addEventListener('click', async () => {
      if (!current) return;
      // Sin GPS no tiene sentido iniciar: explicar cómo activarlo
      const prob = geoProblem() || (await geoDenied() ? 'denied' : null);
      if (prob) { gpsBlocked = true; setChip('📵 Ubicación sin permiso', 'err'); showGpsHelp(prob); return; }
      const at = Date.now();
      // Reanudar el GPS dentro de la etapa abierta (después de una pausa)
      if (current.status === 'en_curso' && current.openStage && !openStageStale()) {
        sendControl('resume');
        startGps(at);
        return;
      }
      // Iniciar el trabajo (etapa 1) o una etapa nueva
      const btn = $('btnStart');
      btn.disabled = true;
      const wasPending = current.status === 'pendiente';
      try {
        const data = await api('POST', `/api/jobs/${current.id}/start`, { at, newStage: openStageStale() || undefined });
        current = { ...current, ...data.job };
        if (data.stage) stages = stages.filter(x => x.id !== data.stage.id && x.endedAt).concat([data.stage]);
        if (wasPending) setupRoute(); // el recorrido pudo cambiar mientras estaba pendiente
        updateTrackVisual();
        if (data.autoClosed && data.autoClosed.length) showMsg('jobMsg', 'Se cerró la etapa que quedó abierta en ' + data.autoClosed.map(x => x.lotName || '#' + x.jobId).join(', ') + '.', 'ok');
      } catch (e) {
        if (e.status) { btn.disabled = false; showMsg('jobMsg', e.message, 'error'); return; }
        // Sin conexión: la etapa empieza igual en el celular y el aviso se manda cuando vuelva la señal
        ctlQueue.push({ userId: session.id, jobId: current.id, action: 'start', at });
        saveCtl();
        const seq = (current.stageCount || 0) + 1;
        current = { ...current, status: 'en_curso', openStage: { id: null, seq, startedAt: new Date(at).toISOString() }, stageCount: seq };
        stages = stages.concat([{ id: null, seq, startedAt: new Date(at).toISOString(), endedAt: null, durationS: 0 }]);
        showMsg('jobMsg', 'Sin conexión: la etapa empezó en el celular y se avisa al servidor cuando vuelva la señal.', 'ok');
      }
      btn.disabled = false;
      newStageBreak = true;
      startGps(at);
    });
    // Terminar la etapa de hoy: el trabajo queda en curso para seguir otro día
    $('btnEndStage').addEventListener('click', async () => {
      if (!current || current.status !== 'en_curso') return;
      if (!confirm('¿Terminar la etapa de hoy?\n\nEl trabajo queda EN CURSO: otro día tocás “Iniciar etapa” y seguís desde donde dejaste.')) return;
      const at = Date.now();
      const seq = current.openStage ? current.openStage.seq : current.stageCount;
      const pctBefore = stages.length && stages[stages.length - 1].routePctStart != null ? stages[stages.length - 1].routePctStart : null;
      stopGps();
      await flushQueue(); // primero los puntos de la etapa
      ctlQueue.push({ userId: session.id, jobId: current.id, action: 'stage-end', at });
      saveCtl();
      current = { ...current, openStage: null, pausedAt: null, lastStageEndedAt: new Date(at).toISOString() };
      stages = stages.map(x => x.endedAt ? x : { ...x, endedAt: new Date(at).toISOString(), durationS: Math.round((at - new Date(x.startedAt).getTime()) / 1000) });
      renderJob();
      await flushControls();
      const jobId = current.id;
      let gained = null;
      if (!ctlQueue.some(c => c.jobId === jobId)) {
        try {
          const d = await api('GET', '/api/jobs/' + jobId);
          if (current && current.id === jobId) {
            current = { ...current, ...d.job };
            stages = d.stages || stages;
            const st = stages.find(x => x.seq === seq);
            if (st && st.routePctGained != null) gained = st.routePctGained;
            renderJob();
          }
        } catch (_) {}
      } else if (routeProgress && pctBefore != null) {
        gained = routeProgress.summary().pct - pctBefore;
      }
      showMsg('jobMsg', `Etapa ${seq} terminada ✓` + (gained != null && current.route ? ` Aportó +${nf1(gained)}% de la ruta.` : '') +
        ' El trabajo sigue en curso: cuando vuelvas, tocá “Iniciar etapa”.', 'ok');
    });
    $('btnPause').addEventListener('click', pauseGps);
    $('btnSync').addEventListener('click', () => { retryDelay = 3000; lastSendOk = true; flushQueue(); });
    $('btnFinish').addEventListener('click', async () => {
      if (!confirm('¿Finalizar el trabajo completo? Después no se puede seguir registrando el recorrido.\n\nSi sólo terminaste por hoy, usá “Terminar etapa por hoy”.')) return;
      stopGps();
      await flushQueue();
      if (queue.some(q => q.jobId === current.id)) {
        showMsg('jobMsg', 'Sin conexión: todavía hay puntos sin enviar. Probá finalizar cuando vuelva la señal (los puntos quedan guardados).', 'error');
        return;
      }
      try {
        const data = await api('POST', `/api/jobs/${current.id}/finish`);
        current = { ...current, ...data.job };
        try { const d = await api('GET', '/api/jobs/' + current.id); stages = d.stages || stages; current = { ...current, ...d.job }; } catch (_) {}
        renderJob();
        updateTrackVisual(); // muestra la zona cubierta final
        showMsg('jobMsg', 'Trabajo finalizado ✓ Ruta ' + (data.job.routePct != null ? Math.round(data.job.routePct) + '%' : '–') +
          ' · zona cubierta ' + Math.round(data.job.coveragePct || 0) + '%', 'ok');
      } catch (e) {
        showMsg('jobMsg', e.message, 'error');
      }
    });
    $('btnBack').addEventListener('click', () => {
      if (watchId !== null && !confirm('El GPS está registrando. ¿Pausarlo y volver a la lista?')) return;
      pauseGps();
      current = null;
      trackCoords = [];
      setSource('track', EMPTY_FC);
      setSource('coverage', EMPTY_FC);
      routeProgress = null;
      setSource('route', EMPTY_FC);
      showView('list');
      lastListFit = ''; // al volver, encuadrar de nuevo todos los lotes
      updateMapButtons();
      loadJobs();
    });

    async function logoutTracker() {
      if (watchId !== null && !confirm('El GPS está registrando. ¿Salir igual?')) return;
      pauseGps();
      const pendingCount = queue.filter(mine).length;
      if (pendingCount && !confirm(`Hay ${pendingCount} puntos GPS sin enviar. Si salís quedan guardados en este celular y se envían la próxima vez que entres. ¿Salir?`)) return;
      // Avisar la pausa antes de cerrar la sesión (si no hay conexión, queda guardada para la próxima)
      await Promise.race([flushControls(), new Promise(r => setTimeout(r, 4000))]);
      logout();
    }

    // Refrescar la lista cada 15 s (nuevas asignaciones) y el estado del trabajo abierto
    setInterval(async () => {
      if (!current) return loadJobs();
      if (current.deleted) return;
      const jobId = current.id;
      try {
        const data = await api('GET', `/api/jobs/${jobId}/track?since=999999999999&job=1`);
        if (!current || current.id !== jobId) return;
        const statusChanged = data.status !== current.status;
        if (data.job) {
          // El supervisor pudo editar el trabajo (fórmula, notas, lote o recorrido)
          const routeKey = JSON.stringify([current.route, current.routeToleranceM, current.passWidthM]);
          const geomKey = JSON.stringify(current.geometry);
          const stageKey = JSON.stringify([current.stageCount, current.openStage && current.openStage.id]);
          current = { ...current, ...data.job };
          if (JSON.stringify([current.stageCount, current.openStage && current.openStage.id]) !== stageKey) {
            api('GET', '/api/jobs/' + jobId).then(d => { if (current && current.id === jobId) { stages = d.stages || []; renderJob(); } }).catch(() => {});
          }
          if (JSON.stringify(current.geometry) !== geomKey) {
            zoneFeature = { type: 'Feature', properties: {}, geometry: current.geometry };
            setSource('zone', zoneFeature);
          }
          if (JSON.stringify([current.route, current.routeToleranceM, current.passWidthM]) !== routeKey) {
            setupRoute();
            lastCov = null;
            whenMapReady(() => RouteLayers.setSwath(map, 't-', jobWidth(current), turf.centroid(zoneFeature).geometry.coordinates[1]));
          }
          updateTrackVisual();
        }
        current.status = data.status;
        if (statusChanged && data.status === 'en_curso' && !watchId) showMsg('jobMsg', 'El supervisor reabrió el trabajo: podés seguir en una etapa nueva.', 'ok');
        if (statusChanged && !['pendiente', 'en_curso'].includes(data.status)) {
          stopGps();
          showMsg('jobMsg', 'El supervisor marcó el trabajo como ' + STATUS_LABELS[data.status].toLowerCase() + '.', 'error');
        }
        renderJob();
      } catch (e) {
        if (current && current.id === jobId && e.status === 410) { onJobDeleted(); return; }
        if (current && current.id === jobId && /no encontrado/i.test(e.message)) {
          stopGps();
          showMsg('jobMsg', 'Este trabajo ya no está asignado a vos. Volvé a la lista.', 'error');
        }
      }
    }, 15000);

    // El supervisor eliminó el trabajo: cortar el GPS y avisar (lo registrado ya quedó guardado)
    function onJobDeleted() {
      if (!current || current.deleted) return;
      stopGps();
      current.deleted = true;
      $('deletedBox').style.display = '';
      $('jobMsg').className = 'msg';
      renderJob();
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }

    loadJobs();
    startPreview(); // pedir la ubicación apenas se abre la página (sólo para mostrarla)
    loadAlertSettings();
    setInterval(loadAlertSettings, 10 * 60 * 1000);
    updateNetBox();
    flushQueue(); // envía lo que haya quedado de una sesión anterior
  </script>
</body>
</html>
