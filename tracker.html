<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tracker GPS – Aplicador</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>
  <script src="auth.js"></script>
  <script src="route-progress.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: linear-gradient(90deg, #1e3a5f, #0f172a);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.05rem; color: #38bdf8; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .role-badge {
      background: #22c55e; color: #052e16;
      font-size: 0.65rem; font-weight: 700;
      padding: 2px 8px; border-radius: 999px;
    }
    .btn-logout {
      background: transparent; border: 1px solid #475569; color: #94a3b8;
      padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;
    }
    .btn-logout:hover { border-color: #ef4444; color: #fca5a5; }
    #map { flex: 1; min-height: 0; width: 100%; }
    .bottom-panel {
      background: #1e293b; border-top: 1px solid #334155;
      padding: 12px 16px 16px; flex-shrink: 0;
      max-height: 55vh; overflow-y: auto;
    }
    .view { display: none; }
    .view.show { display: block; }
    .panel-title {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: #94a3b8; margin-bottom: 10px;
    }
    .job-list { display: flex; flex-direction: column; gap: 8px; }
    .job-card {
      background: #0f172a; border: 1px solid #334155; border-radius: 10px;
      padding: 10px 12px; cursor: pointer;
    }
    .job-card:active, .job-card:hover { border-color: #22c55e; }
    .job-card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .job-card .lot { font-weight: 600; }
    .job-card .meta { font-size: 0.78rem; color: #94a3b8; margin-top: 4px; line-height: 1.4; }
    .pill { font-size: 0.66rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .st-pendiente { background: #422006; color: #fbbf24; }
    .st-en_curso { background: #052e16; color: #4ade80; }
    .st-finalizado { background: #0c4a6e; color: #7dd3fc; }
    .st-cancelado { background: #27272a; color: #a1a1aa; }
    .empty {
      background: #422006; color: #fbbf24; font-size: 0.85rem;
      padding: 10px 12px; border-radius: 8px;
    }
    .job-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
    .job-head h2 { font-size: 1rem; }
    .formula { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 4px; }
    .notes { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; }
    .status-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.9rem; margin: 8px 0 10px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; flex-shrink: 0; }
    .dot.active {
      background: #22c55e; box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 10px;
    }
    .stat {
      background: #0f172a; border-radius: 8px; padding: 8px; text-align: center;
    }
    .stat .val { font-size: 1.1rem; font-weight: 700; color: #38bdf8; }
    .stat .lbl { font-size: 0.65rem; color: #94a3b8; margin-top: 2px; }
    .coverage-bar {
      height: 8px; background: #334155; border-radius: 999px;
      overflow: hidden; margin-bottom: 12px;
    }
    .coverage-bar .fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e);
      border-radius: 999px; transition: width 0.3s;
    }
    .route-box { background: #0f172a; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
    .route-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #cbd5e1; }
    .route-head strong { color: #4ade80; font-size: 1rem; }
    .route-box .coverage-bar { margin: 6px 0; }
    .route-box .fill { background: linear-gradient(90deg, #64748b, #22c55e); }
    .route-next { font-size: 0.75rem; color: #94a3b8; cursor: pointer; }
    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1; padding: 14px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .btn-start { background: #22c55e; color: #052e16; }
    .btn-pause { background: #f59e0b; color: #451a03; }
    .btn-stop { background: #ef4444; color: white; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .link-btn { background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 0.85rem; margin-top: 12px; }
    .msg { font-size: 0.82rem; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; display: none; }
    .msg.error { display: block; background: #450a0a; color: #fca5a5; }
    .msg.ok { display: block; background: #052e16; color: #86efac; }
    .net {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 0.78rem; color: #94a3b8; background: #0f172a; border-radius: 8px;
      padding: 6px 10px; margin-bottom: 10px;
    }
    .net.offline { color: #fbbf24; background: #422006; }
    .net .sync { background: none; border: 1px solid #475569; color: #cbd5e1; border-radius: 6px;
      font-size: 0.72rem; padding: 3px 8px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>📍 Mi recorrido</h1>
    <div class="header-right">
      <span id="userName" style="font-size:0.85rem;color:#94a3b8"></span>
      <span class="role-badge">APLICADOR</span>
      <button class="btn-logout" onclick="openPasswordDialog()" title="Cambiar mi contraseña">🔑</button>
      <button class="btn-logout" onclick="logoutTracker()">Salir</button>
    </div>
  </header>

  <div id="map"></div>

  <div class="bottom-panel">
    <!-- Lista de trabajos asignados -->
    <div class="view show" id="listView">
      <div class="panel-title">Mis trabajos</div>
      <div class="msg" id="listMsg"></div>
      <div class="job-list" id="jobList"><div class="formula">Cargando…</div></div>
    </div>

    <!-- Trabajo seleccionado -->
    <div class="view" id="jobView">
      <div class="job-head">
        <h2 id="jLot">–</h2>
        <span class="pill" id="jStatus">–</span>
      </div>
      <div class="formula" id="jFormula"></div>
      <div class="notes" id="jNotes"></div>
      <div class="msg" id="jobMsg"></div>
      <div class="net" id="netBox">
        <span id="netText">📶 En línea</span>
        <button class="sync" id="btnSync" style="display:none">Enviar ahora</button>
      </div>
      <div class="status-row">
        <div class="dot" id="dot"></div>
        <span id="statusText">GPS detenido</span>
      </div>
      <div class="stats">
        <div class="stat"><div class="val" id="statPoints">0</div><div class="lbl">Puntos GPS</div></div>
        <div class="stat"><div class="val" id="statCoverage">–</div><div class="lbl">Cobertura</div></div>
        <div class="stat"><div class="val" id="statDistance">0.00</div><div class="lbl">Km</div></div>
      </div>
      <div class="coverage-bar"><div class="fill" id="coverageFill"></div></div>
      <div class="route-box" id="routeBox" style="display:none">
        <div class="route-head"><span>〰️ Recorrido planificado</span><strong id="routePct">0%</strong></div>
        <div class="coverage-bar"><div class="fill" id="routeFill"></div></div>
        <div class="route-next" id="routeNext"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-start" id="btnStart">▶ Iniciar trabajo</button>
        <button class="btn btn-pause" id="btnPause" style="display:none">⏸ Pausar GPS</button>
        <button class="btn btn-stop" id="btnFinish" style="display:none">■ Finalizar</button>
      </div>
      <button class="link-btn" id="btnBack">← Mis trabajos</button>
    </div>
  </div>

  <script>
    const session = requireAuth(['aplicador', 'admin']);
    document.getElementById('userName').textContent = session.name;

    const STATUS_LABELS = { pendiente: 'Pendiente', en_curso: 'En curso', finalizado: 'Finalizado', cancelado: 'Cancelado' };
    const EMPTY_FC = { type: 'FeatureCollection', features: [] };
    const $ = (id) => document.getElementById(id);
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function showMsg(id, text, type) {
      const el = $(id);
      el.textContent = text;
      el.className = 'msg ' + type;
      if (type === 'ok') setTimeout(() => { el.className = 'msg'; }, 3000);
    }
    function fmtDay(v) {
      if (!v) return 'sin fecha';
      const [y, m, d] = v.split('-');
      return `${d}/${m}/${y}`;
    }
    function formulaText(j) {
      const parts = [];
      if (j.product) parts.push(j.product);
      if (j.dose != null) parts.push(j.dose + ' ' + (j.doseUnit || ''));
      if (j.litersPerHa != null) parts.push('caldo ' + j.litersPerHa + ' l/ha');
      return parts.join(' · ') || 'Sin fórmula';
    }
    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || ('Error ' + res.status));
        err.status = res.status;
        throw err;
      }
      return data;
    }

    // ===== MAPA =====
    mapboxgl.accessToken = '__MAPBOX_TOKEN__';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/satellite-streets-v12',
      center: [-60.7, -33.0],
      zoom: 13,
      attributionControl: false
    });
    map.addControl(new mapboxgl.NavigationControl({ showCompass: true }), 'top-right');
    map.addControl(new mapboxgl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    }), 'top-right');

    let mapReady = false;
    const onMapReady = [];
    function whenMapReady(fn) { if (mapReady) fn(); else onMapReady.push(fn); }
    map.on('load', () => {
      map.addSource('zone', { type: 'geojson', data: EMPTY_FC });
      map.addSource('coverage', { type: 'geojson', data: EMPTY_FC });
      map.addSource('track', { type: 'geojson', data: EMPTY_FC });
      map.addLayer({ id: 'zone-fill', type: 'fill', source: 'zone', paint: { 'fill-color': '#0ea5e9', 'fill-opacity': 0.15 } });
      map.addLayer({ id: 'coverage-fill', type: 'fill', source: 'coverage', paint: { 'fill-color': '#22c55e', 'fill-opacity': 0.35 } });
      map.addLayer({ id: 'zone-outline', type: 'line', source: 'zone', paint: { 'line-color': '#38bdf8', 'line-width': 2, 'line-dasharray': [2, 1] } });
      map.addSource('route', { type: 'geojson', data: EMPTY_FC });
      map.addLayer({
        id: 'route-pending', type: 'line', source: 'route', filter: ['==', ['get', 'done'], false],
        paint: { 'line-color': '#e2e8f0', 'line-width': 4, 'line-opacity': 0.9, 'line-dasharray': [2, 1.5] }
      });
      map.addLayer({
        id: 'route-done', type: 'line', source: 'route', filter: ['==', ['get', 'done'], true],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#22c55e', 'line-width': 7, 'line-opacity': 0.95 }
      });
      map.addLayer({
        id: 'track-line', type: 'line', source: 'track',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#38bdf8', 'line-width': 4, 'line-opacity': 0.95 }
      });
      mapReady = true;
      onMapReady.splice(0).forEach(fn => fn());
    });
    function setSource(id, data) { whenMapReady(() => map.getSource(id).setData(data || EMPTY_FC)); }

    // ===== ESTADO =====
    let jobs = [];
    let current = null;       // trabajo seleccionado
    let zoneFeature = null;
    let trackCoords = [];     // [[lng, lat], ...] en orden de tiempo
    let watchId = null;
    let userMarker = null;
    let wakeLock = null;
    let routeProgress = null; // avance del recorrido planificado (si el trabajo tiene)
    let nextRun = null;

    // ===== LISTA =====
    async function loadJobs() {
      try {
        const data = await api('GET', '/api/jobs?scope=mine&status=pendiente,en_curso');
        jobs = data.jobs;
        renderJobs();
      } catch (e) {
        showMsg('listMsg', e.message, 'error');
      }
    }
    function renderJobs() {
      const list = $('jobList');
      if (!jobs.length) {
        list.innerHTML = '<div class="empty">⚠️ No tenés trabajos asignados. Pedile al supervisor que te asigne uno.</div>';
        setSource('zone', EMPTY_FC);
        return;
      }
      list.innerHTML = jobs.map(j => `
        <div class="job-card" data-id="${j.id}">
          <div class="top">
            <span class="lot">${esc(j.lotName || 'Trabajo #' + j.id)}</span>
            <span class="pill st-${j.status}">${STATUS_LABELS[j.status]}</span>
          </div>
          <div class="meta">🧪 ${esc(formulaText(j))}<br>📅 ${fmtDay(j.scheduledDate)}${j.machine ? ' · 🚜 ' + esc(j.machine) : ''}</div>
        </div>`).join('');
      // Mostrar todos los lotes asignados en el mapa
      const fc = { type: 'FeatureCollection', features: jobs.filter(j => j.geometry).map(j => ({ type: 'Feature', properties: {}, geometry: j.geometry })) };
      setSource('zone', fc);
      if (fc.features.length) whenMapReady(() => map.fitBounds(turf.bbox(fc), { padding: 50, maxZoom: 16 }));
    }
    $('jobList').addEventListener('click', (e) => {
      const card = e.target.closest('.job-card');
      if (card) selectJob(Number(card.dataset.id));
    });

    function showView(name) {
      $('listView').classList.toggle('show', name === 'list');
      $('jobView').classList.toggle('show', name === 'job');
    }

    // ===== TRABAJO =====
    async function selectJob(id) {
      try {
        const data = await api('GET', '/api/jobs/' + id);
        current = data.job;
        zoneFeature = { type: 'Feature', properties: {}, geometry: current.geometry };
        const pending = queue.filter(q => q.jobId === current.id).map(q => q.point);
        trackCoords = data.points.concat(pending).sort((a, b) => a.ts - b.ts).map(p => [p.lng, p.lat]);
        showView('job');
        $('jobMsg').className = 'msg';
        setupRoute();
        renderJob();
        setSource('zone', zoneFeature);
        whenMapReady(() => map.fitBounds(turf.bbox(zoneFeature), { padding: 50, maxZoom: 17 }));
        updateTrackVisual();
      } catch (e) {
        showMsg('listMsg', e.message, 'error');
      }
    }

    function renderJob() {
      $('jLot').textContent = current.lotName || 'Trabajo #' + current.id;
      $('jStatus').textContent = STATUS_LABELS[current.status];
      $('jStatus').className = 'pill st-' + current.status;
      $('jFormula').textContent = '🧪 ' + formulaText(current) + ' · 📅 ' + fmtDay(current.scheduledDate);
      $('jNotes').textContent = [current.machine ? '🚜 ' + current.machine : '', current.notes ? '📝 ' + current.notes : ''].filter(Boolean).join(' · ');
      const tracking = watchId !== null;
      const start = $('btnStart');
      start.style.display = tracking ? 'none' : '';
      start.textContent = current.status === 'en_curso' ? '▶ Reanudar GPS' : '▶ Iniciar trabajo';
      start.disabled = !['pendiente', 'en_curso'].includes(current.status);
      $('btnPause').style.display = tracking ? '' : 'none';
      $('btnFinish').style.display = current.status === 'en_curso' ? '' : 'none';
      $('dot').classList.toggle('active', tracking);
      if (!tracking) {
        $('statusText').textContent = current.status === 'en_curso'
          ? 'GPS en pausa – ' + trackCoords.length + ' puntos'
          : (current.status === 'pendiente' ? 'Listo para iniciar' : 'Trabajo ' + STATUS_LABELS[current.status].toLowerCase());
      }
    }

    function setupRoute() {
      routeProgress = current && current.route ? new RouteProgress(current.route, current.routeToleranceM) : null;
      if (routeProgress && routeProgress.empty) routeProgress = null;
      $('routeBox').style.display = routeProgress ? '' : 'none';
      if (!routeProgress) setSource('route', EMPTY_FC);
    }

    function updateRouteVisual() {
      if (!routeProgress) return;
      routeProgress.setTrack(trackCoords);
      const sm = routeProgress.summary();
      $('routePct').textContent = sm.pct.toFixed(0) + '%';
      $('routeFill').style.width = sm.pct + '%';
      setSource('route', routeProgress.toGeoJSON());
      const rem = routeProgress.remaining();
      if (!rem.length) {
        nextRun = null;
        $('routeNext').textContent = '✅ Recorrido planificado completo';
        return;
      }
      // Tramo pendiente más cercano a la posición actual (o el primero si todavía no hay GPS)
      const here = trackCoords[trackCoords.length - 1];
      nextRun = rem[0];
      let best = Infinity;
      if (here) {
        for (const r of rem) {
          const d = Math.min(turf.distance(here, r.start, { units: 'meters' }), turf.distance(here, r.coords[r.coords.length - 1], { units: 'meters' }));
          if (d < best) { best = d; nextRun = r; }
        }
      }
      const left = sm.remainingM >= 1000 ? (sm.remainingM / 1000).toFixed(2) + ' km' : Math.round(sm.remainingM) + ' m';
      $('routeNext').textContent = `Faltan ${left} · Próximo tramo: pasada ${nextRun.pass}` +
        (Number.isFinite(best) ? `, a ${Math.round(best)} m` : '') + ' (tocá para verlo)';
    }
    $('routeNext').addEventListener('click', () => {
      if (nextRun) whenMapReady(() => map.fitBounds(turf.bbox(turf.lineString(nextRun.coords)), { padding: 60, maxZoom: 18 }));
    });

    function updateTrackVisual() {
      updateRouteVisual();
      $('statPoints').textContent = trackCoords.length;
      if (trackCoords.length < 2) {
        setSource('track', EMPTY_FC);
        setSource('coverage', EMPTY_FC);
        $('statDistance').textContent = '0.00';
        $('statCoverage').textContent = '–';
        $('coverageFill').style.width = '0%';
        return;
      }
      let line = turf.lineString(trackCoords);
      setSource('track', line);
      $('statDistance').textContent = turf.length(line, { units: 'kilometers' }).toFixed(2);
      if (trackCoords.length > 500) line = turf.simplify(line, { tolerance: 0.000005 });
      const buffered = turf.buffer(line, 0.008, { units: 'kilometers' });
      setSource('coverage', buffered);
      if (zoneFeature) {
        try {
          const inter = turf.intersect(turf.featureCollection([zoneFeature, buffered]));
          const pct = inter ? Math.min(100, (turf.area(inter) / turf.area(zoneFeature)) * 100) : 0;
          $('statCoverage').textContent = pct.toFixed(1) + '%';
          $('coverageFill').style.width = pct + '%';
        } catch (_) {}
      }
    }

    // ===== COLA OFFLINE DE PUNTOS =====
    // Cada punto se guarda primero en localStorage y se envía en lotes. Si no hay señal,
    // quedan guardados (aunque se cierre la página) y se mandan cuando vuelve la conexión.
    // Cada punto lleva un id propio, así el servidor ignora los reenvíos duplicados.
    const QUEUE_KEY = 'chaman_gps_cola_v1';
    const QUEUE_MAX = 20000;
    const BATCH_SIZE = 200;
    let queue = loadQueue();
    // Sólo se envían los puntos del usuario logueado (si el celular es compartido, los demás esperan)
    const mine = (q) => q.userId === undefined || q.userId === session.id;
    let flushing = false;
    let flushTimer = null;
    let retryDelay = 3000;
    let lastSendOk = true;

    function loadQueue() {
      try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; } catch { return []; }
    }
    function saveQueue() {
      try {
        localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
      } catch (_) {
        // Almacenamiento lleno: se descartan los puntos más viejos
        queue = queue.slice(-Math.floor(queue.length / 2));
        try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); } catch (_) {}
      }
    }
    function newPointId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }
    function enqueuePoint(jobId, point) {
      queue.push({ userId: session.id, jobId, point: { id: newPointId(), ...point } });
      if (queue.length > QUEUE_MAX) queue = queue.slice(-QUEUE_MAX);
      saveQueue();
      updateNetBox();
      scheduleFlush(2000);
    }
    function scheduleFlush(delay) {
      if (flushTimer) return;
      flushTimer = setTimeout(() => { flushTimer = null; flushQueue(); }, delay);
    }

    async function flushQueue() {
      if (flushing || !queue.some(mine)) { updateNetBox(); return; }
      flushing = true;
      try {
        while (queue.some(mine)) {
          const jobId = queue.find(mine).jobId;
          const batch = queue.filter(q => mine(q) && q.jobId === jobId).slice(0, BATCH_SIZE);
          let res;
          try {
            res = await fetch(`/api/jobs/${jobId}/track`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ points: batch.map(q => q.point) })
            });
          } catch (_) {
            res = null; // sin conexión
          }
          if (res && res.status === 401) { lastSendOk = false; break; } // auth.js redirige al login; la cola queda guardada
          if (!res || res.status >= 500 || res.status === 429) {
            lastSendOk = false;
            scheduleFlush(retryDelay);
            retryDelay = Math.min(retryDelay * 2, 60000);
            break;
          }
          const sent = new Set(batch.map(q => q.point.id));
          if (!res.ok) {
            // 403/404/409: el trabajo no acepta más puntos (cancelado, reasignado, etc.): se descartan
            const data = await res.json().catch(() => ({}));
            if (current && current.id === jobId) showMsg('jobMsg', (data.error || 'El servidor rechazó puntos') + ' (se descartaron ' + batch.length + ' puntos)', 'error');
          }
          queue = queue.filter(q => !sent.has(q.point.id));
          saveQueue();
          lastSendOk = true;
          retryDelay = 3000;
        }
      } finally {
        flushing = false;
        updateNetBox();
      }
    }

    function updateNetBox() {
      const n = queue.filter(mine).length;
      const offline = !navigator.onLine || !lastSendOk;
      const box = $('netBox');
      if (!box) return;
      box.classList.toggle('offline', offline && n > 0);
      $('netText').textContent = offline
        ? (n ? `📴 Sin conexión – ${n} puntos guardados en el celular` : '📴 Sin conexión')
        : (n ? `📶 Enviando… ${n} puntos pendientes` : '📶 En línea – todo enviado');
      $('btnSync').style.display = n ? '' : 'none';
    }

    window.addEventListener('online', () => { retryDelay = 3000; flushQueue(); });
    window.addEventListener('offline', updateNetBox);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) flushQueue(); });
    setInterval(() => { if (queue.some(mine)) flushQueue(); }, 15000);

    // ===== GPS =====
    function onPosition(pos) {
      const { latitude, longitude, accuracy, speed } = pos.coords;
      if (accuracy && accuracy > 100) {
        $('statusText').textContent = 'Señal GPS débil (±' + Math.round(accuracy) + ' m)…';
        return;
      }
      const lngLat = [longitude, latitude];
      trackCoords.push(lngLat);
      if (!userMarker) {
        const el = document.createElement('div');
        el.style.cssText = 'width:16px;height:16px;background:#22c55e;border:3px solid white;border-radius:50%;box-shadow:0 0 10px #22c55e;';
        userMarker = new mapboxgl.Marker(el).setLngLat(lngLat).addTo(map);
      } else {
        userMarker.setLngLat(lngLat);
      }
      map.easeTo({ center: lngLat, duration: 800 });
      updateTrackVisual();
      $('statusText').textContent = 'Recorriendo… registrando GPS';
      enqueuePoint(current.id, { lat: latitude, lng: longitude, accuracy, speed, ts: pos.timestamp || Date.now() });
    }

    async function requestWakeLock() {
      try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
    }

    function startGps() {
      if (!navigator.geolocation) {
        alert('Tu navegador no soporta geolocalización');
        return;
      }
      watchId = navigator.geolocation.watchPosition(
        onPosition,
        (err) => {
          $('statusText').textContent = 'Error de GPS: ' + err.message;
          if (err.code === err.PERMISSION_DENIED) {
            stopGps();
            showMsg('jobMsg', 'Activá el permiso de ubicación del navegador para registrar el recorrido.', 'error');
          }
        },
        { enableHighAccuracy: true, maximumAge: 1500, timeout: 15000 }
      );
      requestWakeLock();
      $('statusText').textContent = 'Buscando señal GPS…';
      renderJob();
    }

    function stopGps() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
      if (current) renderJob();
    }

    $('btnStart').addEventListener('click', async () => {
      if (!current) return;
      try {
        if (current.status === 'pendiente') {
          const data = await api('POST', `/api/jobs/${current.id}/start`);
          current = { ...current, ...data.job };
          setupRoute(); // el recorrido pudo cambiar mientras estaba pendiente
          updateTrackVisual();
        }
        startGps();
      } catch (e) {
        showMsg('jobMsg', e.message, 'error');
      }
    });
    $('btnPause').addEventListener('click', stopGps);
    $('btnSync').addEventListener('click', () => { retryDelay = 3000; lastSendOk = true; flushQueue(); });
    $('btnFinish').addEventListener('click', async () => {
      if (!confirm('¿Finalizar el trabajo? Después no se puede seguir registrando el recorrido.')) return;
      stopGps();
      await flushQueue();
      if (queue.some(q => q.jobId === current.id)) {
        showMsg('jobMsg', 'Sin conexión: todavía hay puntos sin enviar. Probá finalizar cuando vuelva la señal (los puntos quedan guardados).', 'error');
        return;
      }
      try {
        const data = await api('POST', `/api/jobs/${current.id}/finish`);
        current = { ...current, ...data.job };
        renderJob();
        showMsg('jobMsg', 'Trabajo finalizado ✓', 'ok');
      } catch (e) {
        showMsg('jobMsg', e.message, 'error');
      }
    });
    $('btnBack').addEventListener('click', () => {
      if (watchId !== null && !confirm('El GPS está registrando. ¿Pausarlo y volver a la lista?')) return;
      stopGps();
      current = null;
      trackCoords = [];
      if (userMarker) { userMarker.remove(); userMarker = null; }
      setSource('track', EMPTY_FC);
      setSource('coverage', EMPTY_FC);
      routeProgress = null;
      setSource('route', EMPTY_FC);
      showView('list');
      loadJobs();
    });

    function logoutTracker() {
      if (watchId !== null && !confirm('El GPS está registrando. ¿Salir igual?')) return;
      stopGps();
      const pendingCount = queue.filter(mine).length;
      if (pendingCount && !confirm(`Hay ${pendingCount} puntos GPS sin enviar. Si salís quedan guardados en este celular y se envían la próxima vez que entres. ¿Salir?`)) return;
      logout();
    }

    // Refrescar la lista cada 15 s (nuevas asignaciones) y el estado del trabajo abierto
    setInterval(async () => {
      if (!current) return loadJobs();
      try {
        const data = await api('GET', `/api/jobs/${current.id}/track?since=999999999999`);
        if (data.status !== current.status) {
          current.status = data.status;
          if (!['pendiente', 'en_curso'].includes(data.status)) {
            stopGps();
            showMsg('jobMsg', 'El supervisor marcó el trabajo como ' + STATUS_LABELS[data.status].toLowerCase() + '.', 'error');
          }
          renderJob();
        }
      } catch (_) {}
    }, 15000);

    loadJobs();
    updateNetBox();
    flushQueue(); // envía lo que haya quedado de una sesión anterior
  </script>
</body>
</html>
