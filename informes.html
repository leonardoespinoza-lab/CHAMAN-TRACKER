<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Informes – Sistema de Fumigación</title>
  <script src="auth.js"></script>
  <script src="alerts-core.js"></script>
  <script src="gestion-core.js"></script>
  <link rel="stylesheet" href="gestion.css" />
  <link rel="stylesheet" href="responsive.css" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    main.rep { max-width: 1280px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .page-head h1 { font-size: 1.35rem; font-weight: 600; color: var(--text-strong); letter-spacing: -0.02em; }
    .page-head p { color: var(--text-muted); font-size: 0.86rem; margin-top: 4px; }
    .builder { display: grid; grid-template-columns: 1.05fr 1fr 1.15fr; gap: 0; padding: 0; overflow: hidden; }
    .builder > .col { padding: 16px 18px; border-right: 1px solid var(--border); min-width: 0; }
    .builder > .col:last-of-type { border-right: none; }
    .builder h2 { display: flex; align-items: center; gap: 8px; }
    .builder h2 .i { width: 15px; height: 15px; color: var(--accent-text); }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .presets button { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); border-radius: 999px; padding: 6px 11px; font-size: 0.78rem; cursor: pointer; }
    .presets button:hover { border-color: var(--border-strong); color: var(--text); }
    .presets button.on { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-text); }
    .dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dates label, .filters label { margin-top: 0; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .filters .full { grid-column: 1 / -1; }
    .secs { display: grid; grid-template-columns: 1fr; gap: 2px; }
    .sec { display: flex; align-items: flex-start; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 0.86rem; color: var(--text); font-weight: 500; margin: 0; }
    .sec:hover { background: var(--surface-hover); }
    .sec input { margin-top: 1px; width: 18px; height: 18px; }
    .sec small { display: block; color: var(--text-subtle); font-size: 0.74rem; font-weight: 400; margin-top: 1px; }
    .sec-tools { display: flex; gap: 10px; font-size: 0.78rem; margin: 4px 0 6px; }
    .sec-tools a { cursor: pointer; }
    .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-2); }
    .actions .grow { flex: 1; }
    .actions .btn .i { width: 16px; height: 16px; }
    .actions .status { color: var(--text-muted); font-size: 0.82rem; }
    #preview { margin-top: 18px; }
    #preview[hidden] { display: none; }
    .rep-meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 0.85rem; }
    .rep-meta dt { color: var(--text-muted); font-weight: 600; }
    .rep-meta dd { color: var(--text); }
    .rep-notes { margin-top: 10px; color: var(--text-muted); font-size: 0.8rem; }
    .rep-notes li { margin-left: 18px; }
    .rep-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
    .rep-head h2.t { font-size: 1.05rem; text-transform: none; letter-spacing: -0.01em; color: var(--text-strong); margin-bottom: 2px; }
    .rep-head .sub { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 12px; }
    .kpis { display: grid; margin: 14px 0 0; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
    .kpi .lab { text-transform: uppercase; }
    .kpi .sub { color: var(--text-subtle); font-size: 0.76rem; margin-top: 6px; }
    .tcard { margin-top: 14px; }
    .tcard h2 { display: flex; align-items: center; gap: 8px; justify-content: space-between; font-size: 0.78rem !important; color: var(--text-2) !important; }
    .tcard h2 .cnt { color: var(--text-muted); font-size: 0.78rem; font-weight: 500; }
    .tcard .table-wrap { max-height: 520px; overflow: auto; }
    .tcard table th { position: sticky; top: 0; background: var(--surface-2); z-index: 1; white-space: nowrap; }
    .tcard table td { white-space: nowrap; }
    .tcard table td.wrap { white-space: normal; min-width: 160px; }
    .tcard .more { color: var(--text-muted); font-size: 0.78rem; margin-top: 8px; }
    .maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    .mapc { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
    .mapc svg { width: 100%; height: 120px; display: block; }
    .mapc .n { font-size: 0.8rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 6px; }
    .mapc .c { font-size: 0.74rem; color: var(--text-muted); }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.76rem; color: var(--text-muted); margin-bottom: 10px; }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
    .empty { color: var(--text-muted); font-size: 0.86rem; font-style: italic; }
    @media (max-width: 1100px) { .builder { grid-template-columns: 1fr 1fr; } .builder > .col:nth-of-type(2) { border-right: none; } .builder > .col:nth-of-type(3) { grid-column: 1 / -1; border-top: 1px solid var(--border); } .secs { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px) {
      .builder { grid-template-columns: 1fr; }
      .builder > .col { border-right: none; border-top: 1px solid var(--border); }
      .builder > .col:first-of-type { border-top: none; }
      .secs { grid-template-columns: 1fr; }
      .filters { grid-template-columns: 1fr; }
      .actions .btn { flex: 1 1 calc(50% - 8px); }
      .actions .grow { display: none; }
      .tcard .table-wrap { max-height: none; }
      .tcard table td { white-space: normal; }
    }
  </style>
</head>
<body class="gestion-page informes-page">
  <script src="nav.js"></script>

  <main class="rep">
    <div class="page-head">
      <div>
        <h1>Informes</h1>
        <p>Elegí el período, los filtros y las secciones. Revisá la vista previa y exportá en PDF, Excel o CSV.</p>
      </div>
    </div>

    <form class="card builder" id="builder" autocomplete="off">
      <div class="col">
        <h2><svg class="i" aria-hidden="true"><use href="icons.svg#i-calendar-range"/></svg>Período</h2>
        <div class="presets" id="presets">
          <button type="button" data-p="month">Este mes</button>
          <button type="button" data-p="prev">Mes anterior</button>
          <button type="button" data-p="30">Últimos 30 días</button>
          <button type="button" data-p="90">Últimos 90 días</button>
          <button type="button" data-p="year">Este año</button>
        </div>
        <div class="dates">
          <div><label for="from">Desde</label><input type="date" id="from" required /></div>
          <div><label for="to">Hasta</label><input type="date" id="to" required /></div>
        </div>
        <p class="help" style="margin-top:8px">Incluye los trabajos creados, programados, aplicados o finalizados en el período (hora Argentina).</p>
      </div>
      <div class="col">
        <h2><svg class="i" aria-hidden="true"><use href="icons.svg#i-filter"/></svg>Filtros <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">(opcionales)</span></h2>
        <div class="filters">
          <div><label for="fApp">Aplicador</label><select id="fApp"><option value="">Todos</option></select></div>
          <div><label for="fMachine">Máquina</label><select id="fMachine"><option value="">Todas</option></select></div>
          <div><label for="fProduct">Producto</label><select id="fProduct"><option value="">Todos</option></select></div>
          <div><label for="fStatus">Estado del trabajo</label><select id="fStatus"><option value="">Todos</option></select></div>
          <div class="full"><label for="fJob">Lote / trabajo</label><select id="fJob"><option value="">Todos</option></select></div>
        </div>
      </div>
      <div class="col">
        <h2><svg class="i" aria-hidden="true"><use href="icons.svg#i-file-chart-column"/></svg>Secciones</h2>
        <div class="sec-tools"><a id="secAll">Todas</a><a id="secNone">Ninguna</a></div>
        <div class="secs" id="secs"></div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary" id="btnPreview"><svg class="i" aria-hidden="true"><use href="icons.svg#i-eye"/></svg>Vista previa</button>
        <span class="grow"></span>
        <span class="status" id="status" role="status"></span>
        <button type="button" class="btn btn-outline" data-fmt="pdf" id="btnPdf"><svg class="i" aria-hidden="true"><use href="icons.svg#i-file-text"/></svg>PDF</button>
        <button type="button" class="btn btn-outline" data-fmt="xlsx" id="btnXlsx"><svg class="i" aria-hidden="true"><use href="icons.svg#i-file-spreadsheet"/></svg>Excel</button>
        <button type="button" class="btn btn-outline" data-fmt="csv" id="btnCsv"><svg class="i" aria-hidden="true"><use href="icons.svg#i-file-down"/></svg>CSV</button>
      </div>
    </form>

    <section id="preview" hidden aria-live="polite"></section>
  </main>

  <script>
    const session = requireAuth(['admin', 'supervisor']);
    initAlertsNav();
    const { esc, api } = G;
    const $ = (s) => document.querySelector(s);
    const SEC_HELP = {
      resumen: 'Trabajos, ha, cobertura, horas, consumo, compras, alertas',
      trabajos: '% cobertura, ha, producto, dosis, consumo, carencia/reingreso, etapas y mapas',
      productos: 'Ha, horas y consumo estimado por producto; compras del período',
      stock: 'Saldos actuales y movimientos del período',
      maquinaria: 'Km y horas en el período, totales y service',
      alertas: 'Alertas operativas del período',
      exposicion: 'Horas por clase toxicológica y avisos por aplicador',
      rendimiento: 'Ha/hora, % de ruta, alertas y velocidad por aplicador'
    };

    // ---------- período ----------
    const iso = (d) => d.toISOString().slice(0, 10);
    const nowAr = () => new Date(Date.now() - 3 * 3600e3);
    function preset(p) {
      const t = nowAr(), y = t.getUTCFullYear(), m = t.getUTCMonth();
      let from, to = iso(t);
      if (p === 'month') from = iso(new Date(Date.UTC(y, m, 1)));
      else if (p === 'prev') { from = iso(new Date(Date.UTC(y, m - 1, 1))); to = iso(new Date(Date.UTC(y, m, 0))); }
      else if (p === 'year') from = iso(new Date(Date.UTC(y, 0, 1)));
      else from = iso(new Date(t.getTime() - (Number(p) - 1) * 86400e3));
      $('#from').value = from; $('#to').value = to;
      markPreset(p);
    }
    function markPreset(p) { document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', b.dataset.p === p)); }
    document.querySelectorAll('#presets button').forEach(b => b.onclick = () => preset(b.dataset.p));
    ['from', 'to'].forEach(id => $('#' + id).addEventListener('input', () => markPreset(null)));
    preset('month');

    // ---------- opciones ----------
    const opt = (v, t) => `<option value="${esc(v)}">${esc(t)}</option>`;
    async function loadOptions() {
      const o = await api('/api/reports/options');
      $('#fApp').insertAdjacentHTML('beforeend', o.applicators.map(a => opt(a.id, a.name + (a.active ? '' : ' (inactivo)'))).join(''));
      $('#fMachine').insertAdjacentHTML('beforeend', o.machines.map(m => opt(m.id, m.name + (m.active ? '' : ' (inactiva)'))).join(''));
      $('#fProduct').insertAdjacentHTML('beforeend', o.products.map(p => opt(p.id, p.name)).join(''));
      $('#fStatus').insertAdjacentHTML('beforeend', o.statuses.map(s => opt(s.value, s.label)).join(''));
      $('#fJob').insertAdjacentHTML('beforeend', o.jobs.map(j => opt(j.id, `#${j.id} ${j.lot || 'Sin lote'}`)).join(''));
      $('#secs').innerHTML = o.sections.map(s => `<label class="sec"><input type="checkbox" name="sec" value="${s.key}" checked />
        <span>${esc(s.title)}<small>${esc(SEC_HELP[s.key] || '')}</small></span></label>`).join('');
    }
    $('#secAll').onclick = () => document.querySelectorAll('[name=sec]').forEach(c => c.checked = true);
    $('#secNone').onclick = () => document.querySelectorAll('[name=sec]').forEach(c => c.checked = false);

    function query() {
      const p = new URLSearchParams();
      p.set('from', $('#from').value); p.set('to', $('#to').value);
      const secs = [...document.querySelectorAll('[name=sec]:checked')].map(c => c.value);
      if (!secs.length) throw new Error('Elegí al menos una sección');
      if (!$('#from').value || !$('#to').value) throw new Error('Completá las fechas del período');
      p.set('sections', secs.join(','));
      for (const [id, k] of [['fApp', 'applicatorId'], ['fMachine', 'machineId'], ['fProduct', 'productId'], ['fStatus', 'status'], ['fJob', 'jobId']]) if ($('#' + id).value) p.set(k, $('#' + id).value);
      return p;
    }
    const setStatus = (t, err) => { const s = $('#status'); s.textContent = t || ''; s.style.color = err ? 'var(--danger-text)' : ''; };
    function busy(on) { document.querySelectorAll('#builder button').forEach(b => b.disabled = on); }

    // ---------- vista previa ----------
    $('#builder').addEventListener('submit', async (e) => {
      e.preventDefault();
      let p; try { p = query(); } catch (err) { setStatus(err.message, true); return; }
      busy(true); setStatus('Armando la vista previa…');
      try { render(await api('/api/reports?' + p)); setStatus(''); $('#preview').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      catch (err) { setStatus(err.message, true); }
      finally { busy(false); }
    });

    function render(d) {
      const m = d.meta;
      const fmtD = (s) => s.split('-').reverse().join('/');
      const filters = m.filterLabels.length ? m.filterLabels.map(f => `${esc(f.label)}: <b>${esc(f.value)}</b>`).join(' · ') : 'Sin filtros';
      const gen = new Date(m.generatedAt).toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      let h = `<div class="card"><div class="rep-head"><div><h2 class="t">${esc(m.title)} · ${esc(m.subtitle)}</h2>
          <div class="sub">Vista previa: el PDF usa estas mismas columnas; el Excel y el CSV suman columnas de detalle.</div></div></div>
        <dl class="rep-meta"><dt>Período</dt><dd>${fmtD(m.range.from)} al ${fmtD(m.range.to)}</dd><dt>Filtros</dt><dd>${filters}</dd>
          <dt>Secciones</dt><dd>${esc(m.sectionTitles.join(', '))}</dd><dt>Generado</dt><dd>${esc(gen)} por ${esc(m.generatedBy)}</dd></dl>
        ${m.notes.length ? `<ul class="rep-notes">${m.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}</div>`;
      if (m.sections.includes('resumen')) {
        h += `<div class="kpis">${d.kpis.map(k => `<div class="kpi"><div class="lab">${esc(k.label)}</div><div class="val">${esc(k.text)}</div>${k.sub ? `<div class="sub">${esc(k.sub)}</div>` : ''}</div>`).join('')}</div>`;
      }
      for (const t of d.tables) {
        if (t.key === 'resumen') continue;
        h += `<div class="card tcard" data-table="${esc(t.key)}"><h2>${esc(t.title)} <span class="cnt">${t.total} ${t.total === 1 ? 'fila' : 'filas'}</span></h2>`;
        if (!t.total) h += '<p class="empty">Sin datos para el período y los filtros elegidos.</p>';
        else {
          h += `<div class="table-wrap"><table class="resp"><thead><tr>${t.columns.map(c => `<th${c.num ? ' class="n"' : ''}>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>`;
          h += t.rows.map(r => `<tr>${r.map((v, i) => { const c = t.columns[i]; return `<td data-l="${esc(c.h)}" class="${c.num ? 'n' : ''}${String(v).length > 34 ? ' wrap' : ''}${v === '' ? ' hide-m' : ''}">${esc(v)}</td>`; }).join('')}</tr>`).join('');
          h += '</tbody></table></div>';
          if (t.total > t.rows.length) h += `<p class="more">Se muestran ${t.rows.length} de ${t.total} filas. Exportá para ver todas.</p>`;
        }
        h += '</div>';
        if (t.key === 'trabajos' && d.maps.length) {
          h += `<div class="card tcard" data-table="mapas"><h2>Mapas de cobertura <span class="cnt">${d.maps.length} trabajos</span></h2>
            <div class="legend"><span><i style="background:#3f3f46;border:1px solid #71717a"></i>Lote</span><span><i style="background:#10b981"></i>Zona cubierta</span><span><i style="background:#e4e4e7;height:2px;width:14px;vertical-align:3px"></i>Recorrido GPS</span></div>
            <div class="maps">${d.maps.map(thumb).join('')}</div></div>`;
        }
      }
      $('#preview').innerHTML = h;
      $('#preview').hidden = false;
    }

    // Miniatura SVG (misma proyección que el PDF)
    function thumb(mp) {
      const W = 200, H = 120;
      let body = '<text x="100" y="64" text-anchor="middle" fill="#71717a" font-size="11">Sin geometría</text>';
      if (mp.bbox) {
        const [x0, y0, x1, y1] = mp.bbox, k = Math.cos((y0 + y1) / 2 * Math.PI / 180) || 1;
        const gw = Math.max((x1 - x0) * k, 1e-9), gh = Math.max(y1 - y0, 1e-9), s = Math.min(W / gw, H / gh) * 0.9;
        const ox = (W - gw * s) / 2, oy = (H - gh * s) / 2;
        const P = (c) => `${(ox + (c[0] - x0) * k * s).toFixed(1)},${(oy + (y1 - c[1]) * s).toFixed(1)}`;
        const polys = (g) => !g ? [] : g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
        const lines = (g) => !g ? [] : g.type === 'LineString' ? [g.coordinates] : g.type === 'MultiLineString' ? g.coordinates : [];
        const d = (g) => polys(g).map(p => p.map(r => 'M' + r.map(P).join('L') + 'Z').join('')).join('');
        body = `<path d="${d(mp.zone)}" fill="#27272a" stroke="#71717a" stroke-width="1" fill-rule="evenodd"/>`
          + (mp.covered ? `<path d="${d(mp.covered)}" fill="#10b981" fill-opacity=".6" fill-rule="evenodd"/>` : '')
          + lines(mp.track).map(l => `<polyline points="${l.map(P).join(' ')}" fill="none" stroke="#e4e4e7" stroke-width=".8" stroke-opacity=".85"/>`).join('');
      }
      const cov = mp.coveragePct != null ? `${mp.coveragePct.toLocaleString('es-AR')} % zona · ${(mp.coveredHa || 0).toLocaleString('es-AR')} de ${(mp.areaHa || 0).toLocaleString('es-AR')} ha` : `Sin cobertura · ${(mp.areaHa || 0).toLocaleString('es-AR')} ha`;
      return `<div class="mapc"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa del trabajo ${mp.id}">${body}</svg>
        <div class="n" title="${esc(mp.lot)}">#${mp.id} ${esc(mp.lot)}</div><div class="c">${esc(cov)}</div></div>`;
    }

    // ---------- exportar ----------
    document.querySelectorAll('[data-fmt]').forEach(b => b.onclick = async () => {
      let p; try { p = query(); } catch (err) { setStatus(err.message, true); return; }
      p.set('format', b.dataset.fmt);
      busy(true); setStatus('Generando ' + b.textContent.trim() + '…');
      try {
        const r = await fetch('/api/reports/export?' + p);
        if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || ('Error ' + r.status)); }
        const blob = await r.blob();
        const cd = r.headers.get('Content-Disposition') || '';
        const name = (cd.match(/filename="([^"]+)"/) || [])[1] || ('informe.' + b.dataset.fmt);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        setStatus('Descargado: ' + name);
      } catch (err) { setStatus(err.message, true); }
      finally { busy(false); }
    });

    loadOptions().catch(err => setStatus(err.message, true));
  </script>
</body>
</html>
