<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Sistema de Fumigación</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      color: #e2e8f0;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      font-size: 2.8rem;
      margin-bottom: 8px;
    }
    .logo h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .logo p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: #0ea5e9;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0ea5e9;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn:hover { background: #0284c7; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .error {
      background: #450a0a;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }
    .error.show { display: block; }
    .demo-users {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #334155;
    }
    .demo-users h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 12px;
      text-align: center;
    }
    .user-chips {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid #334155;
      transition: border-color 0.15s;
    }
    .chip:hover { border-color: #0ea5e9; }
    .chip .role {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .role-admin { background: #7c3aed; color: white; }
    .role-supervisor { background: #0ea5e9; color: white; }
    .role-aplicador { background: #22c55e; color: #052e16; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🚜</div>
      <h1>Sistema de Fumigación</h1>
      <p>Seguimiento de cobertura y rutas</p>
    </div>

    <div class="error" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn">Ingresar</button>
    </form>

    <div class="demo-users">
      <h3>Usuarios de prueba (clic para autocompletar)</h3>
      <div class="user-chips">
        <div class="chip" data-user="admin" data-pass="admin">
          <span>admin / admin</span>
          <span class="role role-admin">Admin</span>
        </div>
        <div class="chip" data-user="supervisor" data-pass="supervisor">
          <span>supervisor / supervisor</span>
          <span class="role role-supervisor">Supervisor</span>
        </div>
        <div class="chip" data-user="aplicador" data-pass="aplicador">
          <span>aplicador / aplicador</span>
          <span class="role role-aplicador">Aplicador</span>
        </div>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Si ya está logueado, redirigir
    requireGuest();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('errorMsg');
      const btn = document.querySelector('#loginForm .btn');

      btn.disabled = true;
      btn.textContent = 'Ingresando…';
      const result = await login(username, password);
      btn.disabled = false;
      btn.textContent = 'Ingresar';

      if (!result.ok) {
        errEl.textContent = result.error;
        errEl.classList.add('show');
        return;
      }
      errEl.classList.remove('show');
      redirectByRole(result.session.role);
    });

    // Autocompletar con clic
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.getElementById('username').value = chip.dataset.user;
        document.getElementById('password').value = chip.dataset.pass;
        document.getElementById('errorMsg').classList.remove('show');
      });
    });
  </script>
</body>
</html>
