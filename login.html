<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login – Sistema de Fumigación</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg) 50%, var(--bg) 100%);
      color: var(--text);
    }
    .card {
      background: var(--surface);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      font-size: 2.8rem;
      margin-bottom: 8px;
    }
    .logo h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-text);
    }
    .logo p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .error {
      background: var(--danger-bg);
      color: var(--danger-text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }
    .error.show { display: block; }
  </style>
  <link rel="stylesheet" href="responsive.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body class="login-page">
  <div class="card">
    <div class="logo">
      <div class="logo-icon"><span class="brand-mark brand-lg" aria-hidden="true"><svg class="i" aria-hidden="true"><use href="icons.svg#i-sprout"/></svg></span></div>
      <h1>Sistema de Fumigación</h1>
      <p>Seguimiento de cobertura y rutas</p>
    </div>

    <div class="error" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn">Ingresar</button>
    </form>
  </div>

  <script src="auth.js"></script>
  <script>
    // Si ya está logueado, redirigir
    requireGuest();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('errorMsg');
      const btn = document.querySelector('#loginForm .btn');

      btn.disabled = true;
      btn.textContent = 'Ingresando…';
      const result = await login(username, password);
      btn.disabled = false;
      btn.textContent = 'Ingresar';

      if (!result.ok) {
        errEl.textContent = result.error;
        errEl.classList.add('show');
        return;
      }
      errEl.classList.remove('show');
      goAfterLogin(result.session.role);
    });
  </script>
</body>
</html>
